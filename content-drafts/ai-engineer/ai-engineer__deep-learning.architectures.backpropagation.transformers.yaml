name: Attention Mechanisms & Transformers
classification: required
recommended_depth: practical
estimated_time_minutes: 40
reviewed: true
prerequisites:
  - ai-engineer__deep-learning.architectures.backpropagation.autograd

one_sentence_definition: Scaled dot-product self-attention mechanisms and multi-head Transformer architectures powering modern Large Language Models and foundation AI systems.
why_it_matters: Transformers represent the architectural foundation of contemporary generative AI. Understanding scaled dot-product attention, multi-head projections, positional encodings, and causal masking is necessary for fine-tuning and building with state-of-the-art LLMs.
quick_overview: >
  This skill covers the Transformer architecture introduced in Attention Is All You Need. Engineers explore scaled dot-product self-attention, multi-head attention projections, residual connections, layer normalization, feedforward sub-layers, and rotary positional embeddings (RoPE). Through practical architectural dissection, engineers understand why Transformers achieve quadratic context scalability and how causal masking enables autoregressive token generation.
deep_dive: |
  The Transformer architecture replaces sequential recurrent loops with parallel self-attention mechanisms, enabling massive scalability across GPU clusters.

  At the core is the Scaled Dot-Product Attention operator. Given input token embeddings X, linear projections produce Queries (Q = X * W_Q), Keys (K = X * W_K), and Values (V = X * W_V). The attention score matrix is computed as:
  Scores = softmax((Q * K^T) / sqrt(d_k))
  The scaling factor 1/sqrt(d_k) prevents dot products from growing excessively large in high dimensions, which would otherwise push softmax into regions with vanishingly small gradients.

  Multi-Head Attention splits Q, K, and V into h separate lower-dimensional projection subspaces, allowing the model to simultaneously attend to information at different representation positions (such as syntactic agreement and semantic coreference).

  In decoder-only autoregressive models (like GPT and LLaMA), a Causal Attention Mask (upper-triangular matrix of -inf) is added prior to the softmax step to prevent tokens from attending to subsequent future positions during pre-training and generation.

  Modern LLMs incorporate optimizations such as Pre-Layer Normalization (RMSNorm), Rotary Positional Embeddings (RoPE), FlashAttention (memory-efficient IO-aware GPU kernel tiling), and SwiGLU feedforward activation functions.

