quiz_pool:
  - question: What is the primary mathematical formula for Scaled Dot-Product Attention?
    options:
      - "softmax(Q * K^T / sqrt(d_k)) * V"
      - "sigmoid(Q * K) + V"
      - "tanh(Q + K) * V"
      - "relu(Q * V) / sqrt(d_k)"
    correct_index: 0
  - question: Why are attention dot products scaled by 1/sqrt(d_k)?
    options:
      - To prevent extremely large magnitudes from pushing the softmax function into regions with vanishing gradients
      - To convert complex numbers into real values
      - To enforce zero mean across embedding dimensions
      - To reduce memory consumption from quadratic to linear
    correct_index: 0
  - question: What is the purpose of causal masking in autoregressive decoder-only Transformers?
    options:
      - To prevent tokens from attending to subsequent future tokens during generation
      - To randomly drop 50% of weights during training
      - To eliminate out-of-vocabulary tokens
      - To normalize token embeddings to unit norm
    correct_index: 0
  - question: What advantage does Multi-Head Attention provide over single-head attention?
    options:
      - Allows the model to jointly attend to information from different representation subspaces at different positions
      - Reduces the total number of trainable model parameters
      - Completely removes the need for residual connections
      - Guarantees 100% deterministic training outputs
    correct_index: 0
  - question: What is the computational and memory complexity of standard self-attention with respect to sequence length N?
    options:
      - O(N^2) quadratic complexity
      - O(N) linear complexity
      - O(log N) logarithmic complexity
      - O(1) constant complexity
    correct_index: 0
  - question: What is the function of positional encodings (like RoPE or sinusoidal encodings) in Transformers?
    options:
      - To inject sequence order information since self-attention is permutation-invariant
      - To compress token vocabulary embeddings
      - To compute loss gradients faster
      - To prevent out-of-memory errors on long prompts
    correct_index: 0
  - question: How does FlashAttention achieve significant speedups without changing the exact mathematical output?
    options:
      - By tiling matrix computations to maximize fast GPU SRAM usage and minimize slow HBM memory read/writes
      - By pruning 90% of attention weights
      - By truncating sequence context lengths
      - By running attention in 1-bit precision
    correct_index: 0
  - question: What is the typical structure of a standard Transformer decoder layer?
    options:
      - Masked Multi-Head Attention followed by Add & Norm, then Feedforward Network followed by Add & Norm
      - Convolution followed by Max-Pooling and Dropout
      - Recurrent LSTM cell followed by Softmax
      - Dense Linear layer followed by K-Means clustering
    correct_index: 0
