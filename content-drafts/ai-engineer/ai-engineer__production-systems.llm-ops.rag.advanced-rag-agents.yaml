quiz_pool:
  - question: What is the primary operational loop used in the ReAct agent architecture?
    options:
      - "Thought -> Action (Tool Call) -> Observation (Tool Result) -> Thought"
      - "Map -> Reduce -> Filter"
      - "Forward Pass -> Backward Pass -> Optimizer Step"
      - "Tokenize -> Encode -> Decode"
    correct_index: 0
  - question: How does a Cross-Encoder re-ranker differ from a Bi-Encoder in retrieval pipelines?
    options:
      - Cross-Encoders pass the query and candidate text together into full self-attention, yielding higher accuracy at higher latency
      - Cross-Encoders can only process numeric tabular data
      - Cross-Encoders do not require neural network weights
      - Cross-Encoders run 100x faster than vector dot products
    correct_index: 0
  - question: How does HyDE (Hypothetical Document Embeddings) improve retrieval for vague queries?
    options:
      - Generates a hypothetical answer with an LLM and embeds the answer to retrieve similar real passages
      - Encrypts the user prompt before sending it to the database
      - Translates the prompt into 5 different languages
      - Drops all punctuation marks from the query
    correct_index: 0
  - question: What are the three pillars of the RAG Triad evaluation framework?
    options:
      - "Context Relevance, Groundedness (Faithfulness), and Answer Relevance"
      - "Training Loss, Validation Loss, and Perplexity"
      - "GPU Temperature, RAM Usage, and Disk I/O"
      - "Token Count, Batch Size, and Learning Rate"
    correct_index: 0
  - question: Why is tool schema validation (e.g. using JSON Schema or Pydantic) critical in agent systems?
    options:
      - Ensures LLM-generated arguments conform strictly to the required types before executing backend tools
      - Compiles Python code into machine assembly
      - Prevents users from typing long prompts
      - Speeds up vector database indexing
    correct_index: 0
  - question: What is the purpose of Query Decomposition in complex RAG workflows?
    options:
      - Breaking a multi-part query into independent sub-questions that can be retrieved and synthesized
      - Removing vowels from search terms
      - Splitting large PDFs into 100-word text files
      - Shuffling the order of retrieved documents
    correct_index: 0
  - question: What is Self-RAG (Self-Reflective RAG)?
    options:
      - A framework where the model dynamically assesses whether retrieval is needed and critiques its own generated outputs
      - A system that only reads its own hardcoded source code
      - A RAG pipeline that runs without any embedding model
      - An offline backup vector store
    correct_index: 0
  - question: How can infinite loops be prevented in autonomous LLM agent execution engines?
    options:
      - By enforcing maximum iteration step limits, timeouts, and structured error handling
      - By removing all tools from the agent's prompt
      - By setting temperature to 2.0
      - By disabling LLM context history
    correct_index: 0
