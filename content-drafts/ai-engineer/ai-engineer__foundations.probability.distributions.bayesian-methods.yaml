quiz_pool:
  - question: What is Bayes' Theorem used for in probabilistic machine learning?
    options:
      - Updating the probability of a hypothesis based on new evidence
      - Calculating matrix determinants in polynomial time
      - Compressing floating point weights into integer representations
      - Sorting training samples in ascending order of loss
    correct_index: 0
  - question: "In Bayes' theorem P(A|B) = P(B|A)P(A) / P(B), what is P(A) called?"
    options:
      - Prior probability
      - Posterior probability
      - Likelihood
      - Marginal evidence
    correct_index: 0
  - question: What is the main distinction between Bayesian inference and standard Maximum Likelihood Estimation (MLE)?
    options:
      - Bayesian inference produces probability distributions over parameters rather than single point estimates
      - Bayesian inference only works on discrete categorical data
      - MLE requires quantum computing hardware
      - Bayesian methods never require training data
    correct_index: 0
  - question: What type of uncertainty arises from a model's lack of knowledge due to sparse training data?
    options:
      - Epistemic uncertainty
      - Aleatoric uncertainty
      - Numerical precision noise
      - Sensor measurement error
    correct_index: 0
  - question: What is a conjugate prior in Bayesian statistics?
    options:
      - A prior distribution that results in a posterior distribution of the same family
      - A prior with an infinite standard deviation
      - A prior that forces the likelihood to zero
      - A deterministic constant value
    correct_index: 0
  - question: Which technique is commonly used to approximate intractable high-dimensional posterior distributions?
    options:
      - Markov Chain Monte Carlo (MCMC) and Variational Inference
      - Binary search on sorted arrays
      - Bubble sort iteration
      - Direct linear matrix inversion
    correct_index: 0
  - question: "What role does the likelihood P(Data | Theta) play in Bayesian updating?"
    options:
      - It measures how probable the observed data is given specific parameter values
      - It represents the prior belief before seeing any data
      - It normalizes the denominator to sum to one
      - It defines the learning rate schedule
    correct_index: 0
  - question: What is Maximum A Posteriori (MAP) estimation?
    options:
      - Finding the parameter value that maximizes the posterior probability distribution
      - Calculating the arithmetic mean of all feature columns
      - Selecting the nearest neighbor in embedding space
      - Projecting data onto principal component eigenvectors
    correct_index: 0
