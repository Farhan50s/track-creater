quiz_pool:
  - question: What does the gradient vector of a scalar loss function represent?
    options:
      - The direction and rate of fastest increase of the function
      - The global minimum coordinates of the loss landscape
      - The variance of model parameters
      - The learning rate scaling factor
    correct_index: 0
  - question: In which direction does gradient descent move parameter weights?
    options:
      - In the exact direction of the gradient vector
      - Opposite to the gradient vector (negative gradient)
      - Perpendicular to the gradient vector
      - Along the principal component axis
    correct_index: 1
  - question: What is the primary role of the chain rule in neural network training?
    options:
      - To initialize random network weights
      - To compute derivatives of composite functions through successive layers
      - To serialize model checkpoints to disk
      - To compress token embeddings
    correct_index: 1
  - question: What is a partial derivative?
    options:
      - The derivative of a function with respect to one variable while holding other variables constant
      - An incomplete derivative evaluated only on integers
      - The second derivative of a linear function
      - The ratio of training loss to validation loss
    correct_index: 0
  - question: What mathematical matrix contains all first-order partial derivatives of a vector-valued function?
    options:
      - Hessian matrix
      - Jacobian matrix
      - Covariance matrix
      - Adjacency matrix
    correct_index: 1
  - question: What occurs when gradients approach zero across early layers of a deep network?
    options:
      - Gradient explosion
      - Vanishing gradients
      - Overfitting
      - Quantization noise
    correct_index: 1
  - question: What is the derivative of the standard ReLU activation function f(x) = max(0, x) for x > 0?
    options:
      - "0"
      - "1"
      - "x"
      - "infinity"
    correct_index: 1
  - question: What mathematical matrix contains all second-order partial derivatives of a scalar function?
    options:
      - Hessian matrix
      - Gram matrix
      - Diagonal matrix
      - Confusion matrix
    correct_index: 0
