quiz_pool:
  - question: What is the resulting shape of multiplying a matrix of shape (32, 128) by a matrix of shape (128, 64)?
    options:
      - "(32, 64)"
      - "(128, 128)"
      - "(32, 128)"
      - "(64, 32)"
    correct_index: 0
  - question: Which rule determines whether two tensor shapes are compatible for broadcasting?
    options:
      - Both tensors must have identical memory addresses
      - Trailing dimensions must be equal or one of them must be 1
      - Leading dimensions must both be prime numbers
      - The total number of elements must be identical
    correct_index: 1
  - question: What is the primary performance benefit of vectorized tensor operations over Python for-loops?
    options:
      - Automatic garbage collection suppression
      - Utilization of compiled C-level SIMD instructions and GPU parallelism
      - Elimination of integer overflow checks
      - Dynamic variable type synthesis
    correct_index: 1
  - question: What does the dot product of two normalized unit vectors represent geometrically?
    options:
      - The perpendicular distance between the coordinate origins
      - The cosine of the angle between the two vectors
      - The cross product area of the bounding parallelogram
      - The arithmetic mean of all vector components
    correct_index: 1
  - question: What occurs when you transpose an (M x N) matrix?
    options:
      - All elements are negated
      - Rows and columns are swapped, yielding shape (N x M)
      - The matrix is inverted along its secondary diagonal
      - Negative elements are set to zero
    correct_index: 1
  - question: What is an identity matrix?
    options:
      - A matrix with ones on the main diagonal and zeros elsewhere
      - A matrix composed exclusively of zeros
      - A matrix whose determinant is always zero
      - A matrix with identical rows throughout
    correct_index: 0
  - question: Which operation computes the L2 norm of a vector?
    options:
      - Sum of absolute values of elements
      - Square root of the sum of squared elements
      - Maximum absolute element value
      - Product of non-zero elements
    correct_index: 1
  - question: What is the effect of reshaping a tensor without altering its underlying memory buffer?
    options:
      - It reorders the logical dimensions while preserving the total element count
      - It permanently duplicates the data across GPU memory
      - It forces immediate disk serialization
      - It modifies the floating-point precision
    correct_index: 0
