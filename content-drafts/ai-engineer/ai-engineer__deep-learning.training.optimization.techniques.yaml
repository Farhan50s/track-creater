quiz_pool:
  - question: Why is AdamW preferred over standard Adam for training Transformer models?
    options:
      - It decouples weight decay from gradient updates, ensuring proper L2 regularization
      - It eliminates the need for learning rate warmups entirely
      - It trains models with zero GPU memory overhead
      - It replaces matrix multiplication with convolution
    correct_index: 0
  - question: What is the primary function of Gradient Clipping during neural network training?
    options:
      - Preventing gradient explosion by scaling down gradients when their norm exceeds a threshold
      - Pruning weights that are close to zero
      - Rounding floating-point activations to 8-bit integers
      - Dropping 50% of incoming mini-batches
    correct_index: 0
  - question: What does the first moment vector (m_t) in the Adam optimizer estimate?
    options:
      - The exponentially moving average of past gradients (momentum)
      - The uncentered variance of past gradients
      - The second derivative of the loss surface
      - The ratio of training error to test error
    correct_index: 0
  - question: What is the purpose of a linear learning rate warmup at the beginning of training?
    options:
      - Prevents unstable early updates from corrupting randomly initialized weights before statistics stabilize
      - Warms up the physical GPU hardware temperature
      - Fills the token vocabulary with zero embeddings
      - Converts integer labels into one-hot vectors
    correct_index: 0
  - question: How does Dropout regularize a neural network during training?
    options:
      - By randomly setting a fraction of neuron activations to zero, preventing co-adaptation of features
      - By discarding 20% of the training dataset
      - By clamping parameter weights between -1 and 1
      - By increasing the batch size exponentially
    correct_index: 0
  - question: What happens to Dropout layers during model inference and evaluation?
    options:
      - Dropout is deactivated and all activations are scaled and passed through deterministically
      - Dropout randomly drops twice as many neurons
      - Dropout computes the inverse of the activation matrix
      - Dropout throws an evaluation exception
    correct_index: 0
  - question: In Cosine Annealing learning rate schedules, how does the learning rate evolve over time?
    options:
      - Decreases smoothly following a cosine curve towards a minimum value
      - Increases linearly without bound
      - Remains constant across all training epochs
      - Halves randomly on every second iteration
    correct_index: 0
  - question: What does the second moment vector (v_t) in Adam track?
    options:
      - The exponentially decaying average of squared gradients (element-wise variance)
      - The average magnitude of parameter weights
      - The learning rate scaling multiplier
      - The total count of completed training epochs
    correct_index: 0
