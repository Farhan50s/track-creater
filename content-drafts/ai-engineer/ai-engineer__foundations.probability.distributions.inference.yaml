quiz_pool:
  - question: What does Maximum Likelihood Estimation (MLE) aim to achieve?
    options:
      - Maximize the probability of observing the given dataset under the model parameters
      - Minimize the number of layers in a neural network
      - Equalize the mean and variance across all features
      - Eliminate all outliers from the training set
    correct_index: 0
  - question: Minimizing the negative log-likelihood of a Categorical distribution yields which standard loss function?
    options:
      - Cross-entropy loss
      - Mean Absolute Error (MAE)
      - Huber loss
      - Hinge loss
    correct_index: 0
  - question: Which probability distribution is parameterized by a mean and a standard deviation and forms a symmetric bell curve?
    options:
      - Gaussian (Normal) distribution
      - Poisson distribution
      - Uniform discrete distribution
      - Exponential distribution
    correct_index: 0
  - question: What does the variance of a random variable measure?
    options:
      - The spread or dispersion of values around the expected mean
      - The maximum possible value in the sample space
      - The total count of unique observations
      - The median value of the distribution
    correct_index: 0
  - question: What is the expected value of a fair six-sided die roll?
    options:
      - "3.5"
      - "3.0"
      - "4.0"
      - "6.0"
    correct_index: 0
  - question: What theorem states that the sample mean of independent random variables approaches a normal distribution as sample size increases?
    options:
      - Central Limit Theorem
      - Bayes Theorem
      - Fermat's Last Theorem
      - Spectral Theorem
    correct_index: 0
  - question: What does covariance measure between two random variables?
    options:
      - The degree to which two random variables change together linearly
      - The sum of their individual standard deviations
      - The conditional probability of independent events
      - The absolute difference between their medians
    correct_index: 0
  - question: What is the range of values produced by a valid probability density function or probability mass function?
    options:
      - Non-negative values whose total integral or sum equals 1
      - Any real numbers between -1 and 1
      - Positive integers only
      - Values between 0 and 100
    correct_index: 0
