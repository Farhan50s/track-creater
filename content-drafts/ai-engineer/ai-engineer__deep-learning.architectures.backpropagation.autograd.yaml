quiz_pool:
  - question: What graph algorithm is executed by autograd engines to determine the order of backward gradient propagation?
    options:
      - Reverse topological sort
      - "Dijkstra's shortest path"
      - Breadth-first search queue
      - "Kruskal's minimum spanning tree"
    correct_index: 0
  - question: Why is reverse-mode automatic differentiation preferred over forward-mode for deep neural networks?
    options:
      - It computes gradients for millions of parameters with respect to a single scalar loss in one backward pass
      - It eliminates the need for floating-point calculations
      - It only works on feedforward convolutional networks
      - It requires zero memory for activations
    correct_index: 0
  - question: What happens when multiple computational branches consume the same tensor during the forward pass?
    options:
      - Their incoming gradients are summed together in the backward pass
      - Only the first branch's gradient is retained
      - The autograd engine throws a cyclic graph error
      - The tensor's value is automatically halved
    correct_index: 0
  - question: What does the Vector-Jacobian Product (VJP) compute in reverse-mode autodiff?
    options:
      - The product of an incoming upstream gradient vector with the local Jacobian matrix of the operation
      - The inverse of the Hessian matrix
      - The scalar dot product of model weights
      - The cross product of embedding coordinates
    correct_index: 0
  - question: What is the primary purpose of wrapping inference code in torch.no_grad()?
    options:
      - To disable computation graph creation, reducing memory footprint and accelerating execution
      - To quantize weights to 8-bit integers
      - To prevent model outputs from exceeding 1.0
      - To serialize model parameters to disk
    correct_index: 0
  - question: Which type of operation cannot be differentiated by standard autograd engines without approximations?
    options:
      - Discrete operations like argmax or hard step functions
      - Matrix multiplication
      - Element-wise additions
      - Convolutional filters
    correct_index: 0
  - question: What is stored in intermediate activation tensors during the forward pass?
    options:
      - Values needed to compute the local derivatives during the backward pass
      - Optimizer state vectors like Adam momentum
      - Token vocabulary lookups
      - Serialized model checkpoints
    correct_index: 0
  - question: What does setting a tensor's requires_grad property to False achieve?
    options:
      - Excludes the tensor from computation graph tracking and freezes its gradients
      - Deletes the tensor from memory immediately
      - Forces the tensor to contain only positive numbers
      - Inverts the tensor's dimension order
    correct_index: 0
