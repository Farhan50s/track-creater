quiz_pool:
  - question: What is the primary trade-off of Approximate Nearest Neighbor (ANN) indexing compared to exact k-NN search?
    options:
      - Sacrifices a negligible percentage of recall accuracy in exchange for sub-millisecond search latencies at scale
      - Requires all vectors to contain only binary numbers
      - Only works on datasets smaller than 1,000 vectors
      - Increases memory consumption by 100x without speed improvements
    correct_index: 0
  - question: How does the HNSW (Hierarchical Navigable Small World) index achieve fast vector search?
    options:
      - By traversing a multi-layered graph with skip connections across upper layers and dense local connections at the bottom
      - By computing a full brute-force matrix multiplication on every query
      - By storing all vectors as plain text on disk
      - By randomly sampling 5 vectors per query
    correct_index: 0
  - question: Why is token overlap typically included in text chunking strategies?
    options:
      - To preserve semantic context and continuity across chunk boundaries
      - To artificially inflate the size of the vector database
      - To encrypt sensitive user data
      - To convert Markdown syntax into HTML
    correct_index: 0
  - question: When embedding vectors are normalized to unit length (L2 norm = 1), what is the relationship between dot product and cosine similarity?
    options:
      - The dot product is exactly equal to the cosine similarity
      - The dot product is the inverse of the cosine similarity
      - The dot product is always zero
      - The dot product requires an additional square root operation
    correct_index: 0
  - question: What is the primary benefit of Product Quantization (PQ) in vector search indices?
    options:
      - Compresses high-dimensional vectors into compact byte codes, drastically reducing RAM requirements
      - Guarantees 100% exact precision search
      - Automatically translates queries into multiple languages
      - Converts dense embeddings into sparse keywords
    correct_index: 0
  - question: What is Hybrid Search in modern retrieval architectures?
    options:
      - Combining dense vector semantic search with sparse keyword search (BM25) via fusion algorithms
      - Running queries on both CPU and GPU simultaneously
      - Searching both images and audio files in one prompt
      - Querying multiple cloud providers concurrently
    correct_index: 0
  - question: What does Reciprocal Rank Fusion (RRF) do in retrieval pipelines?
    options:
      - Combines and re-ranks search results from multiple retrieval systems based on rank positions
      - Inverts vector coordinates across the primary axis
      - Deletes duplicate documents from the database
      - Computes gradient updates for embedding models
    correct_index: 0
  - question: What metric measures the proportion of true relevant documents retrieved in top-k search results?
    options:
      - Recall@K
      - Perplexity
      - BLEU score
      - Learning rate
    correct_index: 0
