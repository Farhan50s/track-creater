node_id: ai-engineer__production-systems.llm-ops.rag.embeddings-vector-search
name: Embeddings & Vector Search Architecture
classification: required
recommended_depth: implementation
estimated_time_minutes: 35
reviewed: true
prerequisites:
  - ai-engineer__deep-learning.architectures.backpropagation.transformers

one_sentence_definition: Dense semantic vector embeddings, similarity metrics, and Approximate Nearest Neighbor indexing structures powering enterprise retrieval systems.
why_it_matters: Vector retrieval forms the data foundation of Retrieval-Augmented Generation (RAG). Building scalable semantic search requires understanding embedding models, chunking strategies, and index trade-offs across latency and recall.
quick_overview: >
  This skill covers semantic vector representations and vector search index architectures. Engineers explore dense text embedding models, cosine similarity vs Euclidean distance vs dot product metrics, text chunking strategies with metadata tagging, and Approximate Nearest Neighbor (ANN) index algorithms including Hierarchical Navigable Small World (HNSW) and Inverted File Index with Product Quantization (IVF-PQ).
deep_dive: |
  Dense embeddings map unstructured text into continuous vector spaces (typically 384 to 3072 dimensions) where semantic similarity corresponds to geometric proximity.

  When preparing unstructured documents for retrieval, chunking strategy dictates search granularity. Chunking approaches range from fixed-character sliding windows with token overlap to recursive syntax-aware splitting and semantic boundary chunking. Chunks are enriched with metadata (timestamps, document IDs, access control tags) to enable hybrid filtering.

  Exact k-Nearest Neighbor (k-NN) search computes pairwise distances across the entire corpus in O(N * D) time, which becomes prohibitively slow for millions of vectors. Approximate Nearest Neighbor (ANN) algorithms trade a tiny fraction of recall accuracy for sub-millisecond retrieval latencies:

  1. HNSW (Hierarchical Navigable Small World): Constructs a multi-layer geometric graph where upper layers feature long-range skip connections for rapid navigation and bottom layers contain dense local clustering. HNSW delivers outstanding recall and low query latency at the expense of higher RAM usage.
  2. IVF-PQ (Inverted File with Product Quantization): Clusters vector space into Voronoi cells (IVF) to prune search partitions, and quantizes sub-vectors into codebooks (PQ), drastically compressing index memory by 80-90%.

  Hybrid Search combines dense semantic vector retrieval with sparse keyword scoring (BM25) using Reciprocal Rank Fusion (RRF), ensuring strong retrieval performance across both semantic queries and exact keyword identifier lookups.

