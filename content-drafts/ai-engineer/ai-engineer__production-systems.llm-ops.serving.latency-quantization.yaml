quiz_pool:
  - question: Why is the autoregressive token decoding phase of LLMs memory-bandwidth bound rather than compute bound?
    options:
      - Every single token generation requires streaming billions of model weights from GPU memory (HBM) into compute cores
      - The GPU compute cores are turned off during decoding
      - Decoding only runs on single-core CPUs
      - Token generation requires continuous internet queries
    correct_index: 0
  - question: How does PagedAttention (vLLM) resolve KV-cache memory waste?
    options:
      - Manages KV-cache memory in non-contiguous virtual pages, eliminating internal and external fragmentation
      - Deletes the KV-cache after every generated word
      - Stores all KV-cache vectors on mechanical hard drives
      - Compresses all tokens into a single scalar value
    correct_index: 0
  - question: What is Continuous Batching in production LLM inference engines?
    options:
      - Iteration-level scheduling that inserts and evicts requests at the single-token boundary rather than waiting for entire batches to finish
      - Batching all user requests into a single CSV file processed nightly
      - Running training and inference in the exact same forward pass
      - Restricting concurrent users to 1
    correct_index: 0
  - question: How does AWQ (Activation-aware Weight Quantization) protect model accuracy during 4-bit compression?
    options:
      - Identifies and protects the small percentage of salient weight channels based on activation magnitudes
      - Trains the model from scratch for 100 epochs
      - Replaces all attention layers with linear regressions
      - Rounds all weights to either 0 or 1
    correct_index: 0
  - question: What does Time to First Token (TTFT) measure in LLM serving?
    options:
      - The duration between sending a request and receiving the first generated output token (measuring prompt prefill latency)
      - The total time required to generate 1,000 tokens
      - The time required to download the model weights from the web
      - The physical booting duration of the server hardware
    correct_index: 0
  - question: What is Speculative Decoding?
    options:
      - Using a small fast draft model to speculate multiple tokens ahead, followed by a single parallel verification step by the target model
      - Guessing user prompts before they are submitted
      - Randomly dropping every third token to increase speed
      - Generating text backwards from end to beginning
    correct_index: 0
  - question: In FP16 vs INT4 quantization, what is the approximate reduction factor in model weight memory?
    options:
      - Approximately 4x memory reduction (from 16 bits to 4 bits per parameter)
      - Exactly 2x memory reduction
      - 50x memory reduction
      - 0% memory reduction
    correct_index: 0
  - question: What does Inter-Token Latency (ITL) measure during streaming LLM generation?
    options:
      - The average time taken to generate each subsequent token after the first token arrives
      - The time taken to parse the prompt JSON
      - The cold-start container initialization duration
      - The latency of the client browser rendering DOM nodes
    correct_index: 0
