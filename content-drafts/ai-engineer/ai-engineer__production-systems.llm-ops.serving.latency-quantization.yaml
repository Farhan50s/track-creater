node_id: ai-engineer__production-systems.llm-ops.serving.latency-quantization
name: Inference Optimization & Quantization
classification: recommended
recommended_depth: practical
estimated_time_minutes: 30
reviewed: true
prerequisites:
  - ai-engineer__deep-learning.architectures.backpropagation.transformers

one_sentence_definition: Model compression techniques including post-training quantization, KV-cache paging, and high-throughput inference serving engines.
why_it_matters: Deploying Large Language Models in production requires managing high GPU memory bandwidth and inference costs. Mastering quantization and serving engines is essential for achieving low Time-to-First-Token and high decoding throughput.
quick_overview: >
  This skill covers production LLM serving architectures and model compression methods. Engineers explore Post-Training Quantization (INT8, INT4, AWQ, GPTQ), KV-cache memory dynamics and PagedAttention (as implemented in vLLM), continuous batching, speculative decoding, and key serving metrics: Time to First Token (TTFT), Inter-Token Latency (ITL), and total tokens per second throughput.
deep_dive: |
  LLM inference operates in two distinct phases:
  1. Prefill Phase (Compute-Bound): Processes the input prompt tokens in parallel to populate the initial KV cache.
  2. Decode Phase (Memory-Bandwidth Bound): Autoregressively generates one token at a time, repeatedly loading billions of parameter weights from high-bandwidth GPU memory (HBM) for every single generated token.

  To overcome memory capacity and bandwidth constraints, model quantization converts 16-bit floating-point weights (FP16/BF16) into lower-bit integer representations (INT8/INT4):
  - GPTQ (Generative Pre-trained Quantization): Uses approximate second-order Taylor expansions to minimize output error per layer.
  - AWQ (Activation-aware Weight Quantization): Identifies that only 1% of salient weight channels dictate output accuracy and protects them at full precision while quantizing the remaining 99%.

  PagedAttention (vLLM) resolves memory fragmentation in the KV Cache by managing key-value memory in non-contiguous virtual memory pages (inspired by OS virtual memory paging), increasing GPU batch concurrency by 2x to 4x.

  Continuous Batching dynamically injects incoming requests into running generation iterations at token-level granularity rather than waiting for static batch boundaries, dramatically reducing queue wait times in high-concurrency production endpoints.

