quiz_pool:
  - question: "What is the primary architectural difference between CSS Grid and Flexbox?"
    options:
      - "CSS Grid is a two-dimensional layout system (rows and columns simultaneously), while Flexbox is primarily one-dimensional"
      - "CSS Grid only works on mobile devices"
      - "Flexbox cannot align items vertically"
      - "CSS Grid does not support gap properties"
    correct_index: 0
    explanation: "CSS Grid manages rows and columns concurrently, whereas Flexbox manages distribution along a single main axis at a time."
  - question: "What does the 'fr' unit represent in CSS Grid?"
    options:
      - "A fraction of the available free space in the grid container"
      - "A fixed measurement equal to 14 pixels"
      - "Frame rate per second for CSS animations"
      - "Font resolution scale"
    correct_index: 0
    explanation: "1fr represents one part of the remaining available space after fixed and content-sized tracks are calculated."
  - question: "What does 'grid-template-columns: repeat(auto-fit, minmax(200px, 1fr))' achieve?"
    options:
      - "Creates a responsive grid of columns at least 200px wide that wrap and stretch automatically without media queries"
      - "Forces exactly two columns of 200px on every screen"
      - "Limits the grid to 200 items"
      - "Hides all columns on mobile screens"
    correct_index: 0
    explanation: "auto-fit with minmax generates as many columns as fit the viewport width (minimum 200px), expanding them to share free space."
  - question: "In CSS Grid line numbering, what does line index '-1' refer to?"
    options:
      - "The last edge grid line on the far end of the grid"
      - "An invalid off-screen line"
      - "The first line at the top left"
      - "The center dividing line"
    correct_index: 0
    explanation: "Negative line numbers count backward from the end edge; -1 represents the very last grid line."
  - question: "Which property allows positioning elements using visual ASCII-like layout names?"
    options:
      - "grid-template-areas"
      - "grid-ascii-layout"
      - "grid-area-map"
      - "grid-placement-names"
    correct_index: 0
    explanation: "grid-template-areas defines named grid regions in string format, which children reference via grid-area: name."
  - question: "How can an item be configured to span 3 columns starting from column line 1?"
    options:
      - "grid-column: 1 / span 3"
      - "grid-column: 3"
      - "column-width: 3x"
      - "grid-span: 3"
    correct_index: 0
    explanation: "grid-column: 1 / span 3 places the item at line 1 and extends it across 3 tracks."
  - question: "What does 'grid-auto-flow: dense' do?"
    options:
      - "Instructs the auto-placement algorithm to backfill earlier holes in the grid with smaller items"
      - "Compresses all text inside grid cells"
      - "Removes all gaps between items"
      - "Disables scrolling on the grid"
    correct_index: 0
    explanation: "The 'dense' packing algorithm scans for earlier empty spots in the grid and places smaller subsequent items there to prevent gaps."
  - question: "What is the difference between 'auto-fit' and 'auto-fill' in CSS Grid?"
    options:
      - "auto-fit collapses empty tracks to 0px allowing occupied items to expand, while auto-fill preserves empty tracks"
      - "auto-fill is only for images"
      - "auto-fit requires JavaScript"
      - "There is no difference between auto-fit and auto-fill"
    correct_index: 0
    explanation: "auto-fit stretches items across the whole container by collapsing empty tracks; auto-fill maintains empty tracks if space permits."
