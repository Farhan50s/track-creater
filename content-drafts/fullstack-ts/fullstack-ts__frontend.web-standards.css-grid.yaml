one_sentence_definition: >-
  CSS Grid provides a two-dimensional grid layout engine for positioning elements simultaneously along rows and columns with fractional spatial units.

why_it_matters: >-
  CSS Grid simplifies macro-layout architecture and complex dashboard grids. Using template areas and fractional units eliminates hacky nested wrappers and creates fluid multi-column responsive designs without manual breakpoint media queries.

quick_overview: >-
  CSS Grid Layout is the premier two-dimensional layout system in modern CSS. Unlike Flexbox (which arranges items primarily along a single axis), Grid enables simultaneous coordinate-based positioning across both horizontal rows and vertical columns. Container properties—including grid-template-columns, grid-template-rows, grid-template-areas, and gap—define grid tracks using fractional units (fr), fixed lengths, or percentages. Utility functions like repeat(), minmax(), and autofit/autofill enable fluidly responsive card layouts that adapt automatically to viewport widths. Child items can span multiple columns or rows using grid-column and grid-row coordinates.

deep_dive: >-
  CSS Grid introduces powerful spatial coordinate systems for orchestrating complex interface layouts:

  1. Grid Container Definitions:
  Setting `display: grid` establishes a grid formatting context. Track sizes are defined using `grid-template-columns` and `grid-template-rows`. The fractional unit (`fr`) represents a fraction of available free space after non-flexible tracks and gaps are subtracted.
  ```css
  .dashboard-grid {
    display: grid;
    grid-template-columns: 260px 1fr 300px;
    grid-template-rows: auto 1fr auto;
    gap: 24px;
  }
  ```

  2. Responsive Auto-Fitting Without Media Queries:
  The combination of `repeat()`, `auto-fit`, and `minmax()` produces self-responsive multi-column grids that wrap naturally as viewport widths shrink:
  ```css
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  ```
  `auto-fit` collapses empty tracks to 0px, expanding occupied items to fill the full container row width.

  3. Named Template Areas:
  `grid-template-areas` provides intuitive ASCII-like layout mapping:
  ```css
  .layout {
    display: grid;
    grid-template-areas:
      "header header header"
      "sidebar main ads"
      "footer footer footer";
  }
  .header { grid-area: header; }
  .sidebar { grid-area: sidebar; }
  .main { grid-area: main; }
  ```

  4. Item Placement & Spanning:
  Items can be placed explicitly by line index: `grid-column: 1 / span 2` or `grid-row: 2 / 4`. Grid lines are 1-indexed (with negative indices counting backward from the end). Dense auto-placement (`grid-auto-flow: dense`) fills holes in the grid if smaller items appear later in the DOM.

