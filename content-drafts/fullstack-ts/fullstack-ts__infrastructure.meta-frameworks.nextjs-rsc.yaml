      - "It cancels slow database queries"
      - "It compresses video files"
      - "It turns off CSS rendering"
    correct_index: 0
    explanation: "Suspense streaming sends the page layout and skeleton immediately, streaming data-dependent components as they resolve."
  - question: "Can a Server Component directly query a PostgreSQL database using an ORM without calling an HTTP API route?"
    options:
      - "Yes; Server Components execute on the Node.js server and have direct access to backend persistence and database clients"
      - "No; Server Components must always make fetch() requests to API routes"
      - "Only in development mode"
      - "Only when running on localhost"
    correct_index: 0
    explanation: "Because Server Components run in the server environment, they can invoke database queries and ORMs directly."
  - question: "What restriction applies to props passed from a Server Component to a Client Component?"
    options:
      - "Props must be JSON-serializable (no functions, class instances, or database connection handles)"
      - "Props can only be numbers"
      - "Props cannot exceed 10 characters"
      - "Props must be encrypted"
    correct_index: 0
    explanation: "Data crossing the server-to-client boundary must be serializable into the RSC wire payload format."
  - question: "How can a Client Component render a Server Component without converting it into a Client Component?"
    options:
      - "By passing the Server Component as a 'children' prop into the Client Component container"
      - "By importing the Server Component directly into the client file"
      - "By copying the file into the public directory"
      - "It is impossible to nest server components in client containers"
    correct_index: 0
    explanation: "Using the children pattern (composition), Server Components can be rendered by the server and passed as JSX into client wrappers."
  - question: "What special file in a Next.js route directory automatically creates a Suspense boundary for that route segment?"
    options:
