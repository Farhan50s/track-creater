one_sentence_definition: >-
  React Server Components render data-fetching UI trees exclusively on the server, streaming incremental HTML and serializable JSON to client viewports.

why_it_matters: >-
  Traditional client-side SPAs ship large JavaScript bundles and trigger cascading network waterfalls. React Server Components eliminate data-fetching JavaScript from client bundles, enabling direct database access and instant initial page loads.

quick_overview: >-
  Next.js App Router implements React Server Components (RSC) architecture. By default, components in the app directory are Server Components that execute exclusively on the server during request time or build time. Server Components can perform direct asynchronous database queries and filesystem reads without API route boilerplate. They ship zero JavaScript to the client browser, reducing bundle payloads significantly. When interactive state or event listeners are required, the 'use client' directive designates Client Component boundaries. Suspense boundaries enable progressive HTML streaming, rendering fast UI skeletons while slow server operations resolve.

deep_dive: >-
  Architecting full-stack applications with React Server Components in Next.js:

  1. Server Component vs Client Component Architecture:
  - React Server Components (Default):
    Async functions that fetch data directly:
    ```tsx
    // app/dashboard/page.tsx (Server Component)
    import { db } from '@/lib/db';
    import { Suspense } from 'react';
    import { AnalyticsCard } from './AnalyticsCard';
    import { RealtimeFeed } from './RealtimeFeed'; // Client component

    export default async function DashboardPage() {
      const stats = await db.query.analytics.findFirst();
      return (
        <main className="p-8">
          <AnalyticsCard stats={stats} />
          <Suspense fallback={<p>Loading live stream...</p>}>
            <RealtimeFeed />
          </Suspense>
        </main>
      );
    }
    ```
  - Client Components (`'use client'`):
    Required only when components use React state (`useState`, `useReducer`), effects (`useEffect`), browser APIs (`window`, `localStorage`), or event listeners (`onClick`, `onChange`).

  2. Composition Patterns & Boundary Crossing:
  Server components can import and render client components, and client components can receive server-rendered components as `children` or JSX props:
  ```tsx
  'use client';
  export function ModalWrapper({ children }: { children: React.ReactNode }) {
    const [isOpen, setIsOpen] = useState(false);
    return isOpen ? <div>{children}</div> : null;
  }
  ```
  Props passed across the server-client boundary must be serializable (primitives, plain objects, arrays).

  3. Progressive Streaming with Suspense:
  Next.js streams server HTML chunks over HTTP as they resolve, displaying outer layout shells and Suspense fallbacks immediately without blocking on slow database queries.

