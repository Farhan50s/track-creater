    explanation: "All components inside the Next.js app directory are React Server Components by default unless marked with 'use client'."
  - question: "How much JavaScript code do React Server Components ship to the client browser?"
    options:
      - "Zero JavaScript bytes (they render on the server and stream HTML/RSC payload only)"
      - "Their full TypeScript source code"
      - "50 KB per component"
      - "The entire Node.js runtime"
    correct_index: 0
    explanation: "Server components execute exclusively on the server; their code and heavy dependencies are excluded from client JS bundles."
  - question: "When must the 'use client' directive be declared at the top of a file?"
