one_sentence_definition: >-
  BullMQ manages distributed asynchronous background job processing, worker scheduling, exponential backoff retries, and dead-letter queues on Redis.

why_it_matters: >-
  Executing long-running tasks (such as sending transactional emails, generating PDFs, or video processing) inside synchronous HTTP handlers blocks client responses and leads to timeouts. Background job queues decouple heavy tasks, guaranteeing reliable retry and execution.

quick_overview: >-
  BullMQ is a robust TypeScript message queue and background job processor built on top of Redis streams and atomic Lua scripts. Applications push serializable job payloads to named queues during HTTP request handling, allowing endpoints to respond immediately (<100ms). Independent worker processes consume jobs asynchronously, executing tasks with configurable concurrency limits, rate limits, and priority scheduling. BullMQ provides automatic exponential backoff retries on failure, cron-like recurring job scheduling, and Dead-Letter Queues (DLQ) for inspecting and replaying failed job payloads.

deep_dive: >-
  Architecting decoupled background worker pipelines with BullMQ and Redis:

  1. Queue Producer & Job Dispatch:
  HTTP endpoints dispatch jobs without waiting for execution:
  ```ts
  import { Queue } from 'bullmq';
  import { redisConnection } from '@/lib/redis';

  export const emailQueue = new Queue('emailQueue', { connection: redisConnection });

  // Express or Server Action Handler: Returns immediately
  export async function triggerWelcomeEmail(userId: string, email: string) {
    await emailQueue.add(
      'sendWelcome',
      { userId, email },
      {
        attempts: 5,
        backoff: {
          type: 'exponential',
          delay: 2000, // 2s, 4s, 8s, 16s, 32s
        },
        removeOnComplete: true,
      }
    );
  }
  ```

  2. Dedicated Worker Processing:
  Worker processes run in separate Node.js containers or background services:
  ```ts
  import { Worker, Job } from 'bullmq';
  import { sendEmailService } from '@/services/email';

  const worker = new Worker(
    'emailQueue',
    async (job: Job) => {
      console.log(`[Processing Job ${job.id}]:`, job.name);
      if (job.name === 'sendWelcome') {
        await sendEmailService(job.data.email, job.data.userId);
      }
    },
    { connection: redisConnection, concurrency: 10 }
  );

  worker.on('failed', (job, err) => {
    console.error(`[Job Failed]: ${job?.id} - ${err.message}`);
  });
  ```

  3. Dead-Letter Queues (DLQ) & Observability:
  Jobs that exhaust all configured retry attempts are moved to the Failed set (DLQ). Engineers can inspect failure stack traces, fix underlying bugs or downstream service outages, and trigger mass retries via BullMQ APIs or dashboards like Bull-Board.

