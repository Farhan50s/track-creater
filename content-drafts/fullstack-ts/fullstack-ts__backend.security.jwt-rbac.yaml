one_sentence_definition: >-
  JSON Web Token pairs provide stateless cryptographic authorization, while Role-Based Access Control enforces granular endpoint permissions across application domains.

why_it_matters: >-
  Stateless JWTs reduce database authentication lookups across distributed microservices. Pairing short-lived access tokens with rotating refresh tokens and RBAC middleware enforces strict authorization boundaries without sacrificing performance.

quick_overview: >-
  JSON Web Tokens (JWTs) are cryptographically signed JSON data structures (Header, Payload, Signature) that transmit authenticated claims between client and server. Production systems utilize Token Pair architectures: short-lived Access Tokens (e.g., 15-minute lifespan signed with HMAC-SHA256 or RSA/ECDSA) paired with long-lived Refresh Tokens stored securely in the database with rotation on use. Authorization evaluates claims using Role-Based Access Control (RBAC), where permissions are attached to user roles (such as admin, editor, member) and enforced via Express middleware guards before route handlers execute.

deep_dive: >-
  Architecting stateless authentication token pairs with role-based access gates:

  1. JWT Anatomy & Cryptographic Signing:
  A JWT consists of three base64url-encoded components separated by dots:
  - Header: Algorithm and token type (`{ "alg": "HS256", "typ": "JWT" }`).
  - Payload: Standard registered claims (`sub`, `iat`, `exp`) and custom claims (`role`, `permissions`).
  - Signature: `HMACSHA256(base64UrlEncode(header) + "." + base64UrlEncode(payload), secret)`.
  Because the signature verifies integrity, servers validate authenticity without database read queries.

  2. Token Pair Architecture & Refresh Rotation:
  To mitigate the risk of stolen stateless tokens that cannot be easily revoked:
  - Access Token: Short expiration (15 minutes). Sent in Authorization header (`Bearer <token>`) or HttpOnly cookie.
  - Refresh Token: Long expiration (7–30 days). Stored in a database table (`refresh_tokens`) and delivered in an HttpOnly cookie.
  - Refresh Rotation: When the access token expires, the client hits `/api/auth/refresh`. The server validates the refresh token, revokes it in the database, and issues a brand-new token pair. If a revoked refresh token is reused, the server flags token theft and revokes all active sessions for that user.

  3. Role-Based Access Control (RBAC) Middleware:
  Declarative middleware checks user roles and permissions:
  ```ts
  export function requireRole(allowedRoles: string[]) {
    return (req: AuthenticatedRequest, res: Response, next: NextFunction) => {
      const userRole = req.user?.role;
      if (!userRole || !allowedRoles.includes(userRole)) {
        return res.status(403).json({ error: 'Forbidden: Insufficient privileges' });
      }
      next();
    };
  }

  // Route protection
  app.delete('/api/v1/tracks/:id', authenticateToken, requireRole(['admin']), deleteTrackHandler);
  ```

