quiz_pool:
  - question: "What are the three period-separated parts of a JSON Web Token (JWT)?"
    options:
      - "Header, Payload, and Signature"
      - "Username, Password, and Role"
      - "Algorithm, Data, and Private Key"
      - "Host, Path, and Query"
    correct_index: 0
    explanation: "A JWT is composed of a base64url-encoded Header, Payload (claims), and cryptographic Signature."
  - question: "Why is a short lifespan (e.g., 15 minutes) recommended for stateless JWT Access Tokens?"
    options:
      - "Because stateless tokens cannot be easily revoked before expiration; short lifetimes minimize the exposure window if a token is stolen"
      - "Because browsers delete cookies after 15 minutes"
      - "Because JavaScript memory resets every 15 minutes"
      - "Because JWT signatures expire mathematically"
    correct_index: 0
    explanation: "Short lifespans limit the window of vulnerability if an access token is intercepted."
  - question: "What is 'Refresh Token Rotation'?"
    options:
      - "Every time a refresh token is used to obtain a new access token, the server revokes it and issues a brand-new refresh token"
      - "Rotating database passwords every hour"
      - "Re-encrypting all database records daily"
      - "Changing the JWT signing algorithm on every request"
    correct_index: 0
    explanation: "Refresh token rotation ensures single-use refresh tokens; detecting reuse of an old token signals potential compromise."
  - question: "What HTTP status code should be returned when an authenticated user attempts to access an admin route without sufficient permissions?"
    options:
      - "403 Forbidden"
      - "401 Unauthorized"
      - "404 Not Found"
      - "500 Internal Server Error"
    correct_index: 0
    explanation: "401 means unauthenticated (missing/invalid credentials); 403 means authenticated but forbidden (insufficient privileges)."
  - question: "What does the 'exp' claim represent in a JWT payload?"
    options:
      - "The Unix timestamp expiration time after which the token is rejected as invalid"
      - "The user experience level"
      - "The experimental feature flag"
      - "The export file format"
    correct_index: 0
    explanation: "The 'exp' (Expiration Time) claim specifies the exact timestamp after which the JWT is no longer accepted."
  - question: "What is Role-Based Access Control (RBAC)?"
    options:
      - "Restricting endpoint access based on assigned organizational roles (e.g., admin, editor, member)"
      - "Restricting access based on IP address only"
      - "Encrypting passwords with a role key"
      - "Allowing anyone with an account full system access"
    correct_index: 0
    explanation: "RBAC evaluates permissions mapped to defined roles, gating system resources according to assigned user responsibilities."
  - question: "Can a client decode and read the JSON claims inside a standard JWT payload without the server secret key?"
    options:
      - "Yes; the payload is only base64url-encoded, not encrypted, so sensitive secrets must never be placed in the payload"
      - "No; the secret key encrypts the entire token"
      - "Only in Firefox"
      - "Only if they have the admin password"
    correct_index: 0
    explanation: "Standard JWTs are signed, not encrypted. Anyone can decode the base64 payload; thus, secrets must never be placed in JWT claims."
  - question: "Where should refresh tokens be stored on web clients to prevent XSS theft?"
    options:
      - "In an HttpOnly, Secure, SameSite cookie"
      - "In localStorage"
      - "In a global JavaScript variable"
      - "In sessionStorage"
    correct_index: 0
    explanation: "HttpOnly cookies prevent client-side JavaScript access, shielding refresh tokens from theft during XSS exploits."
