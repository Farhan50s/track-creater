    options:
      - "Sorting, filtering, or inserting items changes item indices, causing React to misidentify items and corrupt component state"
      - "Array indices are not supported in React"
      - "It throws a fatal syntax error"
      - "It increases bundle size by 50%"
    correct_index: 0
    explanation: "Index keys change when items are reordered or filtered, causing React to reuse DOM elements incorrectly."
  - question: "What does 'unidirectional data flow' mean in React?"
    options:
      - "Data flows downward from parent components to child components via props"
      - "Data flows only from child to parent"
      - "Data cannot be updated once rendered"
      - "Components cannot receive callbacks"
    correct_index: 0
    explanation: "In React, state flows strictly downward as props; children communicate updates upward by invoking parent callback functions."
  - question: "What is a 'pure component' render function in React?"
    options:
      - "A component that produces the same JSX output for the same props and does not mutate any variables outside its scope"
      - "A component that has no CSS styles"
      - "A component that cannot use TypeScript"
      - "A component without a return statement"
    correct_index: 0
    explanation: "Pure components behave like pure mathematical functions: they do not produce side effects and produce identical output for identical inputs."
  - question: "What happens during reconciliation when the root element type changes (e.g. from <div> to <span>)?"
    options:
      - "React completely unmounts and destroys the old DOM subtree and builds a new subtree from scratch"
      - "React only updates the tag name while preserving all child state"
      - "React throws a warning and stops rendering"
      - "The browser reloads the page"
    correct_index: 0
    explanation: "Whenever the element type changes at a tree position, React destroys the old subtree and reconstructs the new elements."
  - question: "How does the 'children' prop facilitate component composition in React?"
    options:
      - "It allows parent components to nest arbitrary child JSX elements without needing to know their internal structure"
      - "It copies child components into localStorage"
      - "It restricts components to rendering only text"
      - "It forces components to use class syntax"
    correct_index: 0
    explanation: "The children prop allows container components (e.g., Cards, Dialogs, Shells) to wrap and render arbitrary nested content."
  - question: "Can props passed to a React component be directly mutated by the receiving component?"
    options:
      - "No; props are read-only and immutable"
      - "Yes; props can be reassigned freely"
      - "Only if the prop is a number"
      - "Only in development mode"
    correct_index: 0
    explanation: "Props are strictly immutable. To change values, the component must request state changes via parent callbacks."
  - question: "What is React's Virtual DOM reconciliation complexity?"
    options:
      - "O(N) using heuristic diffing based on element types and keys"
      - "O(N^3) standard tree comparison"
      - "O(1) instant lookup"
      - "O(N^2) quadratic comparison"
