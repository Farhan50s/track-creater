one_sentence_definition: >-
  React functional components translate typed props into declarative JSX element trees through concurrent virtual DOM reconciliation.

why_it_matters: >-
  Understanding JSX compilation, unidirectional data flow, component purity, and reconciliation keys prevents UI state corruption, unnecessary re-renders, and list rendering bugs.

quick_overview: >-
  React functional components are JavaScript functions that accept an immutable props object and return declarative JSX element descriptors. JSX compiles to standard React.createElement (or jsx runtime) calls that produce lightweight Virtual DOM trees. When component state or props change, React evaluates the component and reconciles the new virtual tree against the existing tree using diffing heuristics. Key concepts include unidirectional data flow, component composition (using children props), pure render functions without side-effects, and stable key attributes for dynamic lists to preserve element identity across render cycles.

deep_dive: >-
  React's declarative paradigm transforms how user interfaces are constructed and updated:

  1. Functional Components & JSX:
  JSX is a syntax extension that compiles into function calls returning JavaScript object descriptors (React elements). Components must remain pure functions regarding props: given the same props, a component should return the same JSX without mutating external variables.
  ```tsx
  interface UserCardProps {
    name: string;
    role: string;
    onSelect?: () => void;
  }

  export function UserCard({ name, role, onSelect }: UserCardProps) {
    return (
      <div className="card" onClick={onSelect}>
        <h3>{name}</h3>
        <span className="badge">{role}</span>
      </div>
    );
  }
  ```

  2. Virtual DOM & Reconciliation Heuristics:
  React's diffing algorithm operates in O(N) time based on two assumptions:
  - Two elements of different types (e.g., changing from `<div>` to `<section>`) tear down the entire old subtree and build a new one.
  - In lists of child elements, `key` props identify which elements are retained, moved, or deleted across renders.

  3. The Invariant of Stable List Keys:
  Keys must be unique, stable strings or IDs (such as database primary keys). Using array indices (`key={index}`) as keys causes severe UI bugs when lists are filtered, sorted, or prepended, because index keys trick React into reusing DOM nodes with mismatched internal state.

  4. Component Composition:
  Favoring composition (`children` prop or specialized render props) over deep prop-drilling simplifies component APIs and reduces coupling across application layout layers.

