  - question: "What is a 'stale closure' in the context of React hooks?"
    options:
      - "A callback or effect capturing an outdated variable value from a previous render because the dependency was omitted from the dependency array"
      - "A closed network connection"
      - "A memory leak in the browser V8 engine"
      - "A syntax error in TypeScript"
    correct_index: 0
    explanation: "Stale closures occur when an asynchronous callback captures a variable from an earlier render pass due to missing dependencies."
  - question: "What is the primary difference between useRef and useState?"
    options:
      - "Mutating ref.current does not trigger a re-render, whereas calling a state setter schedules a component re-render"
      - "useRef can only store strings"
      - "useState is only for class components"
      - "useRef resets to null on every render"
    correct_index: 0
    explanation: "useRef provides a mutable container that persists across renders without triggering a new render cycle upon modification."
  - question: "How does 'useCallback(fn, deps)' optimize child component rendering?"
    options:
      - "It preserves referential equality of the function across renders, preventing memoized children (React.memo) from re-rendering unnecessarily"
      - "It runs the function in a background Web Worker"
      - "It converts the function to WebAssembly"
      - "It executes the function before the DOM is created"
    correct_index: 0
    explanation: "useCallback caches function instances, maintaining stable object references needed by React.memo child components."
  - question: "Why should functional state updates like 'setCount(c => c + 1)' be used when updating state based on previous state?"
    options:
      - "It guarantees access to the latest pending state value without needing to include the state variable in closure dependency arrays"
      - "It makes the update run synchronously"
      - "It prevents TypeScript type errors"
      - "It saves 100 bytes of memory"
    correct_index: 0
    explanation: "Functional updaters pass the most up-to-date state as an argument, eliminating stale closure dependencies."
  - question: "When does 'useLayoutEffect' execute compared to 'useEffect'?"
    options:
      - "Synchronously immediately after DOM mutations, before the browser paints the screen"
      - "Asynchronously 5 seconds after paint"
      - "Only on server-rendered components"
      - "Only in development mode"
    correct_index: 0
    explanation: "useLayoutEffect fires synchronously after all DOM mutations and before visual paint, ideal for measuring DOM layout."
