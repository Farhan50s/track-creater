one_sentence_definition: >-
  React hooks manage state lifecycles, side-effect synchronization, memoized computations, and mutable references within functional components.

why_it_matters: >-
  Mastering React hooks is essential for stateful interface engineering. Understanding hook execution lifecycles, effect cleanups, and dependency arrays prevents memory leaks, infinite re-render loops, and stale closures.

quick_overview: >-
  React Hooks provide functional components with access to state and lifecycle synchronization primitives. The standard hook library includes useState for local state, useReducer for complex multi-action state machines, useEffect for side-effect synchronization with external systems, useLayoutEffect for synchronous DOM measurements before paint, useMemo for caching expensive computations, useCallback for preserving callback referential stability, and useRef for persistent mutable containers that do not trigger re-renders. Understanding the Rules of Hooks and composing custom hooks encapsulates complex stateful workflows into modular, testable units.

deep_dive: >-
  React functional components execute repeatedly upon state and prop changes. Hooks allow components to retain persistent state between render passes:

  1. The Rules of Hooks:
  - Call hooks only at the top level (never inside conditionals, loops, or nested functions).
  - Call hooks only from React function components or custom hooks.
  These constraints ensure React can rely on fixed invocation order to match internal state cells to hook calls.

  2. Effect Synchronization & Cleanups:
  `useEffect` coordinates external subscriptions, event listeners, or timers:
  ```tsx
  useEffect(() => {
    const handleResize = () => setWidth(window.innerWidth);
    window.addEventListener('resize', handleResize);
    return () => {
      window.removeEventListener('resize', handleResize);
    };
  }, []);
  ```
  The cleanup function executes before the effect re-runs and during component unmounting, preventing memory leaks.

  3. Stale Closures & Dependency Arrays:
  Every render captures its own props and state in closure scope. Omitting variables from dependency arrays causes effects or callbacks to read outdated values from previous render cycles. Utilizing functional state updaters (`setCount(prev => prev + 1)`) decouples state mutations from current closure values.

  4. Performance Optimization Primitives:
  - `useMemo`: Caches complex calculations: `const result = useMemo(() => heavyCalculation(data), [data])`.
  - `useCallback`: Returns a referentially stable callback instance across renders: `const handleClick = useCallback(() => ..., [deps])`.
  - `useRef`: Stores mutable references (`ref.current`) without scheduling renders, used for direct DOM references and tracking previous values.

