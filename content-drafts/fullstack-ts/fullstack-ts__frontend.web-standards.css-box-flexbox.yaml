quiz_pool:
  - question: "What does setting 'box-sizing: border-box' ensure in CSS?"
    options:
      - "Padding and border are included within the element total specified width and height"
      - "Padding is added outside the specified width"
      - "Margins collapse horizontally"
      - "Elements cannot have borders"
    correct_index: 0
    explanation: "Under border-box, the width and height properties include content, padding, and border, preventing unexpected layout overflows."
  - question: "Which Flexbox property controls the alignment of items along the main axis?"
    options:
      - "justify-content"
      - "align-items"
      - "align-content"
      - "flex-direction"
    correct_index: 0
    explanation: "justify-content distributes items along the main axis (row or column direction)."
  - question: "How can you prevent a fixed-size icon from shrinking inside a flex container with expanding text?"
    options:
      - "Set 'flex-shrink: 0' on the icon element"
      - "Set 'flex-grow: 1' on the icon"
      - "Set 'display: block' on the container"
      - "Set 'margin: auto' on the icon"
    correct_index: 0
    explanation: "flex-shrink: 0 prevents the item from shrinking below its specified basis or content width when space is tight."
  - question: "What does 'justify-content: space-between' do in a flex row container?"
    options:
      - "Distributes items evenly, with the first item on the start edge and the last item on the end edge"
      - "Centers all items in the middle with equal padding"
      - "Puts equal space around all items including the outer edges"
      - "Stacks items vertically"
    correct_index: 0
    explanation: "space-between places the first child at the start, the last child at the end, and distributes remaining space equally in between."
  - question: "What is the effect of setting 'flex: 1' on a flex item?"
    options:
      - "It expands flex-grow: 1, flex-shrink: 1, flex-basis: 0%, allowing the item to fill available free space proportionally"
      - "It sets the item width to exactly 1 pixel"
      - "It disables flex wrapping"
      - "It freezes the element position"
    correct_index: 0
    explanation: "flex: 1 is shorthand for flex: 1 1 0%, letting the item grow and shrink to absorb equal shares of available space."
  - question: "Which property sets gutters between flex items without applying outer margins?"
    options:
      - "gap"
      - "margin-between"
      - "padding-inline"
      - "border-spacing"
    correct_index: 0
    explanation: "The 'gap' property defines gutters between adjacent flex and grid children without bleeding into container edges."
  - question: "If 'flex-direction: column' is set on a container, which property aligns items horizontally across the container?"
    options:
      - "align-items"
      - "justify-content"
      - "flex-wrap"
      - "text-align"
    correct_index: 0
    explanation: "In column direction, the cross axis is horizontal, so align-items controls horizontal alignment."
  - question: "What is the difference between margin and padding in the CSS box model?"
    options:
      - "Padding is space inside the element border, while margin is space outside the element border"
      - "Padding only applies to text elements"
      - "Margins are always colored green"
      - "There is no difference between padding and margin"
    correct_index: 0
    explanation: "Padding adds interior clearance between content and border, whereas margin creates exterior clearance outside the border."
