one_sentence_definition: >-
  Adaptive cryptographic hashing algorithms protect credentials at rest, while HttpOnly SameSite cookie sessions maintain secure server-side authentication state.

why_it_matters: >-
  Storing plaintext passwords or using outdated hash functions like MD5 or SHA-256 leaves user credentials vulnerable to hardware-accelerated rainbow table attacks. Salted adaptive hashing (Argon2id/bcrypt) and HttpOnly cookies prevent credential compromise and XSS session theft.

quick_overview: >-
  Authentication systems verify user identities through cryptographic credentials. Modern security standards mandate hashing passwords using memory-hard, computationally intensive algorithms like Argon2id or bcrypt. These algorithms use unique cryptographic salts per password and configurable cost parameters (work factors) to thwart offline GPU brute-force attacks. Stateful authentication manages login sessions via high-entropy session IDs stored in Redis or PostgreSQL and transmitted to browsers via secure, HttpOnly, SameSite cookies, mitigating Cross-Site Scripting (XSS) and Cross-Site Request Forgery (CSRF) vulnerabilities.

deep_dive: >-
  Implementing bulletproof password storage and stateful session authentication:

  1. Adaptive Password Hashing:
  Passwords must never be hashed with fast cryptographic hashes (e.g., SHA-256) which can compute billions of guesses per second on commodity GPUs. Adaptive algorithms incorporate:
  - Cryptographic Salt: High-entropy random bytes generated per user to defeat precomputed rainbow tables.
  - Work Factors: Configurable CPU, memory, and parallelism parameters (e.g., bcrypt cost $\ge 12$, Argon2id memory $\ge 64\text{MB}$).
  ```ts
  import * as argon2 from 'argon2';

  export async function hashPassword(plainText: string): Promise<string> {
    return argon2.hash(plainText, {
      type: argon2.argon2id,
      memoryCost: 2 ** 16, // 64 MB
      timeCost: 3,
      parallelism: 1,
    });
  }

  export async function verifyPassword(plainText: string, hash: string): Promise<boolean> {
    return argon2.verify(hash, plainText);
  }
  ```

  2. Stateful Session Lifecycle:
  - Generation: On login, the server generates a cryptographically random UUIDv4 or 32-byte hex token.
  - Persistence: Stores `session_id -> { user_id, expires_at, created_at }` in Redis or PostgreSQL.
  - Cookie Delivery:
    ```ts
    res.cookie('session_id', sessionId, {
      httpOnly: true, // Prevents JavaScript document.cookie access (mitigates XSS)
      secure: process.env.NODE_ENV === 'production', // Requires HTTPS
      sameSite: 'lax', // Protects against cross-site request forgery (CSRF)
      maxAge: 7 * 24 * 60 * 60 * 1000, // 7 days
    });
    ```
  - Instant Revocation: Deleting the session key from the database instantly logs the user out across all client windows.

