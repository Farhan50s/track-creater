quiz_pool:
  - question: "Why must passwords be hashed using algorithms like Argon2id or bcrypt rather than fast hashes like SHA-256?"
    options:
      - "Argon2id and bcrypt are deliberately memory-hard and computationally slow, making offline GPU brute-force attacks infeasible"
      - "SHA-256 cannot hash strings longer than 10 characters"
      - "bcrypt compresses passwords to save disk space"
      - "Node.js does not support SHA-256"
    correct_index: 0
    explanation: "Adaptive hashing algorithms consume configurable CPU and memory resources, neutralizing high-speed hardware brute-forcing."
  - question: "What is the primary security advantage of the 'HttpOnly' cookie flag?"
    options:
      - "It prevents client-side JavaScript from accessing the cookie, protecting session tokens from theft via Cross-Site Scripting (XSS)"
      - "It automatically encrypts the cookie on the client"
      - "It removes the cookie expiration date"
      - "It increases network bandwidth"
    correct_index: 0
    explanation: "HttpOnly prevents malicious scripts from reading document.cookie, stopping session hijacking in XSS attacks."
  - question: "What does a cryptographic 'salt' accomplish in password hashing?"
    options:
      - "It ensures identical passwords produce completely different hashes, neutralizing precomputed rainbow table lookup attacks"
      - "It encrypts the database connection"
      - "It checks password complexity"
      - "It compresses the hash string"
    correct_index: 0
    explanation: "A unique random salt per user prevents attackers from using rainbow tables to crack duplicate or common passwords in bulk."
  - question: "What does the 'SameSite=Lax' cookie attribute protect against?"
    options:
      - "Cross-Site Request Forgery (CSRF) attacks"
      - "SQL injection attacks"
      - "Denial of Service attacks"
      - "DNS spoofing"
    correct_index: 0
    explanation: "SameSite=Lax prevents cookies from being sent on cross-origin subrequests, mitigating CSRF exploitation."
  - question: "Why is immediate session revocation straightforward in stateful database/Redis sessions?"
    options:
      - "Deleting the session record from the database immediately invalidates the session upon the next request"
      - "The browser automatically closes"
      - "The user password is changed"
      - "The IP address is banned"
    correct_index: 0
    explanation: "Because the server checks the database/cache on each request, deleting the session record revokes access immediately."
  - question: "What should the 'Secure' cookie attribute be set to in production web applications?"
    options:
      - "true (ensuring cookies are transmitted exclusively over encrypted HTTPS connections)"
      - "false"
      - "optional"
      - "null"
    correct_index: 0
    explanation: "Setting Secure: true guarantees the browser never transmits the cookie over unencrypted plaintext HTTP."
  - question: "What is an Argon2id 'memory cost' parameter?"
    options:
      - "The amount of RAM memory allocated to compute a single hash, defeating ASIC and GPU parallel cracking"
      - "The price of cloud server RAM"
      - "The length of the password string"
      - "The size of the database table"
    correct_index: 0
    explanation: "Argon2id's memory hardness requires attackers to dedicate significant RAM per parallel cracking attempt, making GPU clusters ineffective."
  - question: "Where should user passwords NEVER be logged or transmitted?"
    options:
      - "In plaintext server logs, error tracking tools (e.g. Sentry), or unencrypted HTTP query parameters"
      - "In POST request bodies over HTTPS"
      - "In password reset forms"
      - "Inside cryptographic hash functions"
    correct_index: 0
    explanation: "Passwords must never appear in application logs, telemetry, or query strings where they could be logged by intermediaries."
