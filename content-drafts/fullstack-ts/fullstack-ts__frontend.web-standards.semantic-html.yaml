one_sentence_definition: >-
  Semantic HTML5 establishes meaningful document object models and built-in accessibility landmarks for assistive screen readers and search engines.

why_it_matters: >-
  Semantic elements provide native accessibility landmark roles that assistive technologies rely on for navigation. Replacing generic container divisions with semantic elements improves accessibility compliance and search engine indexability without complex custom ARIA configurations.

quick_overview: >-
  Semantic HTML uses meaningful markup elements—such as header, nav, main, article, section, aside, and footer—to convey the structure and purpose of content directly within the Document Object Model. When browsers parse semantic HTML5 tags, they automatically populate accessibility tree landmarks with standardized roles. This allows screen readers and keyboard navigation tools to jump between content sections seamlessly. Understanding document outline algorithms, heading hierarchies (h1 through h6), interactive form controls (label, fieldset, legend), and ARIA attributes (such as aria-expanded, aria-controls, and aria-live) ensures web applications are universally accessible and WCAG 2.1 compliant.

deep_dive: >-
  Semantic markup is the foundational tier of accessible web architecture. Rather than treating HTML purely as visual styling hooks, semantic elements communicate programmatic intent to the browser rendering engine and accessibility API layers.

  Standard HTML5 structural elements automatically map to WAI-ARIA landmark roles without requiring manual role attributes:
  - `<header>` maps to banner (when scoped to the document root).
  - `<nav>` maps to navigation landmarks, enabling screen reader users to skip directly to navigation menus.
  - `<main>` represents the primary distinct body content of the document, mapping to the main landmark.
  - `<article>` denotes a self-contained, independently distributable composition (such as a blog post, comment, or news item).
  - `<section>` groups thematic content typically introduced with a heading element.
  - `<aside>` represents auxiliary content tangentially related to surrounding material.
  - `<footer>` maps to contentinfo when scoped to the root document.

  Heading hierarchies must follow strict sequential order (h1 -> h2 -> h3) without skipping heading levels, establishing an intuitive document outline. For interactive elements, pairing native `<button>` tags with keyboard focus states (:focus-visible) and appropriate ARIA attributes provides native keyboard activation (Enter and Space keys) that `<div>` click handlers lack by default.

  Form accessibility requires explicit association between `<label for="inputId">` and `<input id="inputId">` elements, wrapping related inputs in `<fieldset>` with descriptive `<legend>` headers. Live regions (`aria-live="polite"` or `aria-live="assertive"`) allow dynamic single-page application notifications to be announced by screen readers without interrupting user interaction flow.

