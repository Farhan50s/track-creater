quiz_pool:
  - question: "Which HTML5 element represents self-contained content intended to be independently distributable?"
    options:
      - "<section>"
      - "<article>"
      - "<aside>"
      - "<header>"
    correct_index: 1
    explanation: "<article> designates independent, self-contained content suitable for standalone syndication or reuse."
  - question: "Why is using a native <button> element preferable to a <div onClick={...}> for clickable actions?"
    options:
      - "Buttons automatically support keyboard focus and trigger on Enter/Space without manual accessibility wiring"
      - "Div elements cannot execute JavaScript"
      - "Buttons execute 50% faster in V8"
      - "Div tags cannot have CSS styles applied"
    correct_index: 0
    explanation: "Native button elements have built-in accessibility roles, tab sequence inclusion, and Space/Enter key event handlers."
  - question: "What landmark role does the <main> element map to in the browser accessibility tree?"
    options:
      - "navigation"
      - "main"
      - "banner"
      - "contentinfo"
    correct_index: 1
    explanation: "The <main> tag maps directly to the main landmark, signaling the central content of the document."
  - question: "How should an accessible HTML form label be linked explicitly to its corresponding text input?"
    options:
      - "Set the label 'for' attribute to match the input 'id' attribute"
      - "Place both inside the same div"
      - "Set the label class to match the input name"
      - "Link them with CSS selectors"
    correct_index: 0
    explanation: "The 'for' attribute on a label links explicitly to the target input's 'id', enabling click-to-focus and screen reader reading."
  - question: "What is the purpose of 'aria-live=\"polite\"' on a dynamic notification container?"
    options:
      - "It tells screen readers to announce new content updates when the user is idle"
      - "It immediately interrupts the user speech synthesizer"
      - "It hides the container permanently"
      - "It plays a browser audio chime"
    correct_index: 0
    explanation: "aria-live='polite' announces dynamic DOM updates at the next available pause without cutting off current screen reader announcements."
  - question: "Which element provides a caption for a <fieldset> grouping related form controls?"
    options:
      - "<label>"
      - "<legend>"
      - "<caption>"
      - "<summary>"
    correct_index: 1
    explanation: "The <legend> element serves as the title or caption for the content enclosed within a <fieldset>."
  - question: "Why should heading levels (h1 through h6) not skip levels in a document outline?"
    options:
      - "Screen reader users navigate via heading shortcuts; skipping levels causes disorientation about document structure"
      - "Skipping headings throws a fatal JavaScript syntax error"
      - "Browsers refuse to render h3 tags without an h2"
      - "CSS cannot style skipped headings"
    correct_index: 0
    explanation: "Screen readers rely on heading hierarchy for document navigation; skipping levels creates confusion regarding nested content relationships."
  - question: "What landmark role is assigned by default to a top-level <footer> element in a document?"
    options:
      - "banner"
      - "contentinfo"
      - "complementary"
      - "region"
    correct_index: 1
    explanation: "A top-level <footer> within the document context maps to the contentinfo landmark role."
