quiz_pool:
  - question: "What does 'EXPLAIN ANALYZE' do in PostgreSQL?"
    options:
      - "Executes the SQL query and displays the actual execution plan, node timings, and buffer usage"
      - "Deletes corrupted database records"
      - "Simulates query execution without running it"
      - "Automatically adds missing indexes"
    correct_index: 0
    explanation: "EXPLAIN ANALYZE executes the statement and outputs real runtime measurements and execution step details."
  - question: "Why are B-Tree indexes the default index type in PostgreSQL?"
    options:
      - "They provide logarithmic O(log N) lookup time for equality and range queries on sorted data"
      - "They use zero megabytes of disk space"
      - "They only work on primary keys"
      - "They convert SQL into binary"
    correct_index: 0
    explanation: "B-Tree indexes maintain sorted tree structures that deliver balanced O(log N) search and range scan performance."
  - question: "What does the 'leftmost prefix rule' dictate for composite indexes on columns (A, B, C)?"
    options:
      - "Queries must filter on column A (the leftmost column) to utilize the composite index"
      - "The index only sorts column C"
      - "Column A must always be a string"
      - "The database scans from right to left"
    correct_index: 0
    explanation: "Composite B-trees can only be traversed if query filters include the leading (leftmost) indexed columns."
  - question: "Which index type is best suited for searching keys and tags inside PostgreSQL JSONB columns?"
    options:
      - "GIN (Generalized Inverted Index)"
      - "B-Tree index"
      - "Hash index"
      - "BRIN index"
    correct_index: 0
    explanation: "GIN indexes excel at indexing multi-value composite types like JSONB objects and arrays."
  - question: "What is a 'Sequential Scan' (Seq Scan) in a query plan?"
    options:
      - "The database engine reads every page of the table from disk to find matching rows"
      - "The database reads rows backwards"
      - "The database scans only index files"
      - "The query executes instantly in cache"
    correct_index: 0
    explanation: "A Seq Scan reads the entire table sequentially from disk, which causes performance issues on large datasets."
  - question: "What is the difference between 'INNER JOIN' and 'LEFT JOIN'?"
    options:
      - "INNER JOIN returns only rows with matches in both tables, whereas LEFT JOIN returns all rows from the left table with NULLs for unmatched right rows"
      - "LEFT JOIN deletes unmatched rows"
      - "INNER JOIN only works on text columns"
      - "There is no functional difference"
    correct_index: 0
    explanation: "LEFT JOIN preserves all rows from the primary left table regardless of whether a matching right row exists."
  - question: "What is a Common Table Expression (CTE) in SQL?"
    options:
      - "A temporary named result set defined within a query using the WITH clause"
      - "A permanent database view stored on disk"
      - "An external database connection"
      - "A custom SQL data type"
    correct_index: 0
    explanation: "CTEs create temporary modular result sets using the WITH keyword to improve readability and query structure."
  - question: "What does a Window Function (such as ROW_NUMBER() OVER (...)) do?"
    options:
      - "Performs calculations across a set of table rows related to the current row without collapsing rows into a single output"
      - "Opens a new browser popup window"
      - "Calculates database uptime"
      - "Deletes old log files"
    correct_index: 0
    explanation: "Window functions compute aggregations and rankings over partitions while preserving individual row granularity."
