one_sentence_definition: >-
  SQL queries execute relational joins, aggregations, and subqueries, while B-Tree and GIN indexes accelerate query performance with logarithmic lookups.

why_it_matters: >-
  As databases scale to millions of rows, unindexed queries trigger costly full table sequential scans that bottleneck application servers. Understanding join algorithms and index structures transforms slow multi-second queries into sub-millisecond lookups.

quick_overview: >-
  Structured Query Language (SQL) is the standard declarative interface for relational data retrieval and manipulation. Core query operations include multi-table relational joins (INNER JOIN, LEFT JOIN, RIGHT JOIN, FULL OUTER JOIN), grouping aggregations (GROUP BY, HAVING, COUNT, SUM, AVG), window functions, and Common Table Expressions (WITH queries). Indexing structures—such as B-Tree for equality and range filters, GIN for full-text search and JSONB arrays, and composite indexes for multi-column conditions—optimize disk page lookups. Analyzing query execution plans via EXPLAIN ANALYZE identifies sequential scans, hash joins, and cost bottlenecks.

deep_dive: >-
  Optimizing relational database performance requires mastering SQL query construction and index mechanics:

  1. Relational Joins & Execution Strategies:
  - `INNER JOIN`: Returns rows where join condition matches in both tables.
  - `LEFT JOIN`: Returns all left table rows, with NULLs for unmatched right rows.
  - PostgreSQL join algorithms:
    - Nested Loop: Efficient when joining small sets with indexed inner tables.
    - Hash Join: Computes in-memory hash tables for large unsorted joins.
    - Merge Join: Efficient when both join inputs are pre-sorted by index.

  2. Common Table Expressions (CTEs) & Window Functions:
  CTEs (`WITH cte_name AS (...)`) structure complex multi-step queries into readable logical units. Window functions (`ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)`) compute running totals and rankings without collapsing result rows.

  3. Index Data Structures:
  - B-Tree Indexes: The default PostgreSQL index. Provides O(log N) lookups for equality (`=`) and range (`<`, `>`, `BETWEEN`) operations on sorted data.
  - Composite Indexes: Indexed across multiple columns (`CREATE INDEX idx_user_status ON users (tenant_id, status)`). Adheres to the leftmost prefix rule: accelerates filters on `(tenant_id)` or `(tenant_id, status)`, but not `(status)` alone.
  - GIN (Generalized Inverted Index): Optimized for composite data types like JSONB keys and array containment (`@>`).

  4. Query Plan Analysis with `EXPLAIN (ANALYZE, BUFFERS)`:
  Running `EXPLAIN ANALYZE` executes the query and returns actual runtime, disk buffer hits, and node costs:
  - Sequential Scan (`Seq Scan`): Scans every table page on disk. Flag for index addition on large tables.
  - Index Scan (`Index Scan` / `Bitmap Index Scan`): Traverses B-tree to retrieve matching row pointers directly.

