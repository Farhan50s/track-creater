one_sentence_definition: >-
  TypeScript static type systems declare domain data shapes, primitive boundaries, interfaces, and composable type aliases at compile time.

why_it_matters: >-
  Static typing catches runtime reference errors, typos, and incompatible data assignments before code reaches production environments. Interfaces and type aliases structure maintainable API contracts across full-stack repositories.

quick_overview: >-
  TypeScript enhances JavaScript by introducing a compile-time static type system. Core primitives (string, number, boolean, null, undefined, symbol, bigint) form the base tier. Object data structures are modeled through Interfaces and Type Aliases. Interfaces provide extensible, mergeable object definitions suited for OOP and public library APIs, while Type Aliases enable primitives, unions, tuples, and intersections. Enabling strict compiler settings—especially strictNullChecks and noImplicitAny in tsconfig.json—ensures comprehensive type coverage and eliminates null pointer exceptions at runtime.

deep_dive: >-
  Understanding static type definitions in TypeScript requires mastering the foundational type primitives and structural typing mechanisms:

  1. Structural Typing vs Nominal Typing:
  TypeScript uses a structural type system (duck typing). Two types are considered compatible if they share the same internal shape, regardless of their explicit declaration names.

  2. Interfaces vs Type Aliases:
  - Interfaces:
    Support declaration merging and interface inheritance (`interface Admin extends User`). They are ideal for modeling public APIs, object shapes, and classes.
    ```ts
    interface User {
      id: string;
      email: string;
      createdAt: Date;
    }
    ```
  - Type Aliases:
    Cannot be reopened for declaration merging, but can define unions, primitives, tuples, function signatures, and intersection types:
    ```ts
    type Role = 'admin' | 'member' | 'guest';
    type UserWithRole = User & { role: Role };
    ```

  3. Type Modifiers:
  - `readonly`: Marks object properties or arrays as immutable, preventing accidental reassignment.
  - `?` (Optional): Allows properties to be undefined.
  - Index Signatures: Defines types for dynamic dictionary keys (`[key: string]: string`).

  4. Top & Bottom Types:
  - `unknown`: The type-safe counterpart to `any`. Operations cannot be performed on an `unknown` value without explicit type narrowing or type assertions (`typeof`, `instanceof`).
  - `any`: Disables type checking entirely; should be avoided in production codebases.
  - `never`: Represents values that never occur (e.g., functions that throw or exhaustive switch branch fallthroughs).

