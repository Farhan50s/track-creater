quiz_pool:
  - question: "What is the primary difference between TypeScript interfaces and type aliases?"
    options:
      - "Interfaces support declaration merging across multiple declarations, whereas type aliases cannot be reopened"
      - "Type aliases only work with numbers"
      - "Interfaces generate runtime JavaScript objects"
      - "Type aliases cannot be exported from modules"
    correct_index: 0
    explanation: "Interfaces can be declared multiple times and automatically merge into a unified definition, while type aliases are immutable once defined."
  - question: "What does 'structural typing' (duck typing) mean in TypeScript?"
    options:
      - "Type compatibility is determined by the shape and properties of the object rather than its nominal class name"
      - "Types must be explicitly cast using the as keyword"
      - "All variables must be strings"
      - "Classes cannot implement interfaces"
    correct_index: 0
    explanation: "In structural typing, if two types share the same required properties and types, TypeScript treats them as compatible."
  - question: "What is the key difference between the 'unknown' type and the 'any' type?"
    options:
      - "unknown requires type checking or narrowing before properties or methods can be accessed, whereas any bypasses all checks"
      - "unknown converts values to undefined"
      - "any is more type-safe than unknown"
      - "unknown cannot be used in function return types"
    correct_index: 0
    explanation: "unknown is a type-safe top type that enforces explicit type verification before operations can be invoked on it."
  - question: "What does the 'readonly' property modifier prevent?"
    options:
      - "Reassigning the property value after object creation"
      - "Reading the property from external files"
      - "Printing the property to console"
      - "Exporting the interface"
    correct_index: 0
    explanation: "The readonly modifier prevents direct mutation of the property after initialization."
  - question: "What does enabling 'strictNullChecks' in tsconfig.json enforce?"
    options:
      - "null and undefined are distinct types and cannot be assigned to other types unless explicitly included in a union"
      - "Null values are converted to 0"
      - "All functions must return null"
      - "Disables optional chaining (?.)"
    correct_index: 0
    explanation: "strictNullChecks prevents null/undefined from being silently assigned to string, number, or object types."
  - question: "What does the 'never' type signify in TypeScript?"
    options:
      - "A type representing values that never occur, such as a function that always throws an error or an unreachable code branch"
      - "A variable that has not been initialized"
      - "An alias for void"
      - "A deprecated interface"
    correct_index: 0
    explanation: "The never type represents unreachable states, used in exhaustive type checking and non-returning functions."
  - question: "How is an intersection type declared in TypeScript?"
    options:
      - "Using the '&' operator (e.g., TypeA & TypeB)"
      - "Using the '|' operator"
      - "Using the '+' operator"
      - "Using the 'extends' keyword only"
    correct_index: 0
    explanation: "The ampersand '&' operator combines multiple types into a single intersection type containing all combined properties."
  - question: "What happens if you compile TypeScript with 'noImplicitAny: true'?"
    options:
      - "The compiler throws an error whenever a variable or parameter lacks an explicit type and cannot be automatically inferred"
      - "Any types are automatically converted to strings"
      - "All types are erased at runtime"
      - "TypeScript allows untyped variables without warning"
    correct_index: 0
    explanation: "noImplicitAny forces developers to provide explicit types when TypeScript cannot safely infer them, preventing accidental 'any' leakages."
