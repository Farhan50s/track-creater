one_sentence_definition: >-
  Redis provides in-memory key-value data structures with sub-millisecond latencies for caching, rate limiting, and distributed state coordination.

why_it_matters: >-
  Heavy database queries degrade under sudden traffic spikes. Implementing Cache-Aside caching with Redis offloads database read load, while sliding-window rate limiters protect APIs from DDoS attacks and abusive scraping.

quick_overview: >-
  Redis (Remote Dictionary Server) is an open-source, in-memory data structure store used as a distributed cache, message broker, and fast database. Operating entirely in RAM with optional background disk persistence, Redis delivers sub-millisecond reads and writes. Common application patterns include the Cache-Aside pattern (checking Redis cache before querying PostgreSQL), setting Time-To-Live (TTL) expiration keys to purge stale data, atomic rate-limiting counters (using INCR and EXPIRE or sliding-window sorted sets), and distributed locking algorithms (Redlock) to prevent concurrency race conditions across server worker clusters.

deep_dive: >-
  Architecting high-throughput distributed caching and API rate limiting using Redis:

  1. The Cache-Aside (Lazy Loading) Pattern:
  Application services check Redis cache before falling back to PostgreSQL:
  ```ts
  import Redis from 'ioredis';

  const redis = new Redis(process.env.REDIS_URL!);

  export async function getCachedTrack(trackId: string) {
    const cacheKey = `track:${trackId}`;
    const cached = await redis.get(cacheKey);
    if (cached) {
      return JSON.parse(cached);
    }

    // Cache Miss: Query Database
    const track = await db.query.tracks.findFirst({ where: eq(tracks.id, trackId) });
    if (track) {
      // Set in cache with 1-hour TTL (3600 seconds)
      await redis.set(cacheKey, JSON.stringify(track), 'EX', 3600);
    }
    return track;
  }
  ```

  2. Cache Invalidation Strategies:
  - Time-To-Live (TTL): Guarantees data expires automatically.
  - Write-Through / Write-Invalidate: Whenever a record is mutated via POST/PATCH, the application immediately deletes the corresponding Redis key (`await redis.del(cacheKey)`).

  3. API Rate Limiting with Sliding Window:
  Protecting endpoints against brute-force abuse using Redis Sorted Sets (`ZADD`, `ZREMRANGEBYSCORE`, `ZCARD`):
  ```ts
  export async function rateLimit(ip: string, limit = 100, windowSec = 60): Promise<boolean> {
    const now = Date.now();
    const clearBefore = now - windowSec * 1000;
    const key = `ratelimit:${ip}`;

    const multi = redis.multi();
    multi.zremrangebyscore(key, 0, clearBefore); // Remove expired timestamps
    multi.zadd(key, now, now.toString()); // Record current request
    multi.zcard(key); // Count active requests in window
    multi.expire(key, windowSec);

    const results = await multi.exec();
    const requestCount = results?.[2]?.[1] as number;
    return requestCount <= limit;
  }
  ```

