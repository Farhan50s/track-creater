  - question: "What is the primary operational characteristic of the 'Cache-Aside' pattern with Redis?"
    options:
      - "The application checks the cache first, querying the primary database and populating the cache with a TTL only upon a cache miss"
      - "The cache automatically empties the database once per hour"
      - "The application writes directly to disk without memory caching"
      - "The client browser bypasses the web server"
    correct_index: 0
    explanation: "Cache-Aside queries cache first; on a miss, it fetches from the database and sets the cache with an expiration."
  - question: "What does 'TTL' (Time-To-Live) signify when setting a key in Redis?"
