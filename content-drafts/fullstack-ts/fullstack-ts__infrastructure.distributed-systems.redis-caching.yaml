      - "Encrypts the key"
    correct_index: 0
    explanation: "INCR performs an atomic integer increment, making it ideal for hit counters and rate limiters."
  - question: "What is a 'Cache Stampede' (Thundering Herd) problem?"
    options:
      - "When a popular cached key expires, and thousands of concurrent requests hit the database simultaneously to recompute it"
      - "When Redis runs out of memory"
      - "When network cables disconnect"
      - "When multiple servers have conflicting hostnames"
    correct_index: 0
    explanation: "A cache stampede occurs when high concurrency overwhelms databases upon the expiration of a frequently accessed cache key."
  - question: "What data structure in Redis is most effective for sliding-window rate limiters?"
    options:
      - "Sorted Sets (ZSET), storing request timestamps as scores"
      - "Linked Lists"
      - "Bitmaps"
      - "JSON arrays"
    correct_index: 0
    explanation: "Sorted sets allow pruning expired timestamps with ZREMRANGEBYSCORE and counting current window requests with ZCARD."
