one_sentence_definition: >-
  Discriminated unions enable exhaustive compile-time pattern matching, while generics parameterize type structures for reusable, type-safe abstractions.

why_it_matters: >-
  Discriminated unions model state transitions (such as loading, success, and error states) with compile-time exhaustiveness guarantees. Generics enable flexible data structures, API clients, and utility helpers without losing precise type resolution.

quick_overview: >-
  Advanced TypeScript systems rely on Discriminated Unions and Generics to express dynamic runtime behavior with compile-time guarantees. Discriminated unions combine multiple object variants that share a common literal tag property (such as status or type), allowing TypeScript to narrow types inside conditional branches and verify exhaustive handling with the never type. Generics parameterize types across functions, interfaces, and classes using type variables (T, K, V). Combining generics with generic constraints (extends), keyof, typeof, conditional types (T extends U ? X : Y), and built-in utilities (Partial, Pick, Omit, Record) unlocks enterprise-grade type safety.

deep_dive: >-
  Mastering advanced type programming in TypeScript involves combining discriminated unions with generic constraints:

  1. Discriminated Unions & Exhaustive Checking:
  A discriminated union models distinct states using a common literal discriminator:
  ```ts
  type AsyncState<T> =
    | { status: 'idle' }
    | { status: 'loading' }
    | { status: 'success'; data: T }
    | { status: 'error'; error: Error };

  function handleState<T>(state: AsyncState<T>) {
    switch (state.status) {
      case 'idle': return 'Waiting...';
      case 'loading': return 'Loading...';
      case 'success': return state.data;
      case 'error': return state.error.message;
      default: {
        const _exhaustiveCheck: never = state;
        throw new Error(`Unhandled state: ${_exhaustiveCheck}`);
      }
    }
  }
  ```
  If a new state variant (e.g., 'cancelled') is added without updating the switch statement, TypeScript raises a compile-time error at `_exhaustiveCheck`.

  2. Generic Functions & Constraints:
  Generics allow functions to capture and propagate argument types:
  ```ts
  function getProperty<T, K extends keyof T>(obj: T, key: K): T[K] {
    return obj[key];
  }
  ```
  The constraint `K extends keyof T` ensures `key` must be a valid property name of `T`, and the return type `T[K]` matches the exact value type of that property.

  3. Conditional Types & Infer:
  Conditional types resolve types based on relationship checks:
  ```ts
  type UnpackPromise<T> = T extends Promise<infer U> ? U : T;
  ```
  The `infer` keyword extracts nested types dynamically within conditional evaluations.

  4. Standard Utility Types:
  - `Partial<T>`: All properties optional.
  - `Required<T>`: All properties required.
  - `Pick<T, K>`: Constructs a type with subset of properties `K`.
  - `Omit<T, K>`: Constructs a type by removing properties `K`.
  - `Record<K, T>`: Constructs an object type whose keys are `K` and values are `T`.

