quiz_pool:
  - question: "What is the defining characteristic of a Discriminated Union in TypeScript?"
    options:
      - "A union of object types that share a common literal property (tag) used by the compiler to narrow types"
      - "A union of only primitive types"
      - "A type that is rejected by the compiler"
      - "A union with no properties"
    correct_index: 0
    explanation: "Discriminated unions share a common literal tag property, allowing TypeScript to narrow the variant inside control-flow branches."
  - question: "How does assigning an unhandled branch to the 'never' type enforce exhaustive checking?"
    options:
      - "If any union member is unhandled, TypeScript attempts to assign that type to never, triggering a compile-time error"
      - "It crashes the browser at runtime"
      - "It converts all unhandled branches to null"
      - "It disables the default switch statement"
    correct_index: 0
    explanation: "Because 'never' cannot hold any value, assigning an unhandled variant to a 'never' variable causes a compile-time type mismatch error."
  - question: "What does '<K extends keyof T>' do in a generic function definition?"
    options:
      - "Constrains generic type K to be one of the known property keys of type T"
      - "Deletes keys from type T"
      - "Extends the class prototype"
      - "Converts object keys into numbers"
    correct_index: 0
    explanation: "extends keyof T restricts K to the union of string/number literal property names belonging to type T."
  - question: "Which utility type constructs a type picking only keys K from type T?"
    options:
      - "Pick<T, K>"
      - "Omit<T, K>"
      - "Extract<T, K>"
      - "Partial<T>"
    correct_index: 0
    explanation: "Pick<T, K> constructs an object type with only the specified set of properties K from T."
  - question: "What does the 'infer' keyword do inside a conditional type?"
    options:
      - "Introduces a type variable to be deduced dynamically from the type being checked"
      - "Forces runtime type deduction in JavaScript"
      - "Converts interfaces into classes"
      - "Throws a runtime exception"
    correct_index: 0
    explanation: "infer allows extracting and naming a sub-type (such as a Promise value or function return type) within a conditional type branch."
  - question: "Which utility type creates an object type with specified key types K and value types T?"
    options:
      - "Record<K, T>"
      - "Dictionary<K, T>"
      - "Map<K, T>"
      - "Object<K, T>"
    correct_index: 0
    explanation: "Record<K, T> generates an object type where keys are of type K and values are of type T."
  - question: "What is the return type of 'UnpackPromise<Promise<string>>' using type UnpackPromise<T> = T extends Promise<infer U> ? U : T?"
    options:
      - "string"
      - "Promise<string>"
      - "unknown"
      - "void"
    correct_index: 0
    explanation: "The conditional type checks if T is a Promise, and infer U extracts the inner type (string)."
  - question: "Why is 'Omit<User, \"password\">' useful in API data transfer objects?"
    options:
      - "It produces a type containing all User fields except the sensitive password property, preventing accidental leakage"
      - "It encrypts the password field in the database"
      - "It deletes the password column from PostgreSQL"
      - "It makes the password property optional"
    correct_index: 0
    explanation: "Omit removes specified keys from a type, creating safe DTO types without sensitive attributes."
