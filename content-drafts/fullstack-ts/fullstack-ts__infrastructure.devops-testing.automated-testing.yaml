one_sentence_definition: >-
  Automated testing pyramids validate software stability across unit calculations, API/database integrations with Vitest, and full browser workflows with Playwright.

why_it_matters: >-
  Manual testing is slow, expensive, and error-prone. A comprehensive automated testing suite prevents functional and visual regressions, giving teams confidence to ship code continuously to production.

quick_overview: >-
  Quality engineering in TypeScript spans a structured testing pyramid: fast unit tests for pure functions and state reducers, integration tests for API endpoints and database queries against test databases, and end-to-end (E2E) tests validating complete user workflows. Vitest provides an ultra-fast test runner that leverages Vite's native ES module pipeline, mock utilities (vi.fn, vi.spyOn), and snapshot testing. Playwright automates real browser sessions across Chromium, Firefox, and WebKit, executing end-to-end user journeys (authentication, checkout, quiz flows) with auto-waiting assertions and network mocking.

deep_dive: >-
  Designing and implementing automated test suites across the testing pyramid:

  1. The Testing Pyramid Architecture:
  - Unit Tests (~70%): Vitest tests isolated utilities, math calculations, schema parsers, and custom React hooks.
  - Integration Tests (~20%): Tests Express routes, database repositories, or Supabase RPCs using test containers or isolated schema transactions.
  - End-to-End Tests (~10%): Playwright drives headless browsers against the compiled application build to test complete user journeys.

  2. Unit & Integration Testing with Vitest:
  ```ts
  import { describe, it, expect, vi, beforeEach } from 'vitest';
  import { calculatePillarProgress } from './progressUtils';

  describe('calculatePillarProgress', () => {
    it('returns 100% when all required nodes are completed', () => {
      const nodes = [
        { id: '1', classification: 'required', status: 'completed' },
        { id: '2', classification: 'optional', status: 'not_started' },
      ];
      const result = calculatePillarProgress(nodes);
      expect(result.completionPercent).toBe(100);
      expect(result.completedRequiredCount).toBe(1);
    });
  });
  ```

  3. Browser End-to-End Testing with Playwright:
  Playwright features built-in auto-waiting, eliminating flaky `sleep()` timeouts:
  ```ts
  import { test, expect } from '@playwright/test';

  test('learner can log in and view active track', async ({ page }) => {
    await page.goto('/login');
    await page.fill('input[type="email"]', 'learner@example.com');
    await page.fill('input[type="password"]', 'Password123!');
    await page.click('button[type="submit"]');

    // Auto-waits for URL redirect
    await expect(page).toHaveURL('/app');
    await expect(page.locator('h1')).toContainText('Track Overview');
  });
  ```

  4. Test Isolation & Database Mocking:
  Tests must remain idempotent: using unique database schema fixtures or database transaction rollbacks ensures tests run independently without polluting persistent state.

