quiz_pool:
  - question: "What is the primary philosophy of the 'Testing Pyramid' in software quality assurance?"
    options:
      - "Maintaining a broad base of fast unit tests, a moderate layer of integration tests, and a small suite of high-confidence E2E tests"
      - "Writing 100% of all tests as manual browser tests"
      - "Only testing the database layer"
      - "Running tests once a month"
    correct_index: 0
    explanation: "The pyramid optimizes test speed, cost, and confidence by favoring unit tests for bulk logic and E2E tests for key user journeys."
  - question: "Why is Vitest significantly faster than older testing frameworks in Vite projects?"
    options:
      - "It shares Vite transform pipeline and plugins directly without requiring redundant transpilation steps"
      - "It skips running assertions"
      - "It runs only in the browser"
      - "It disables TypeScript checks"
    correct_index: 0
    explanation: "Vitest reuses Vite config, loaders, and transforms natively, providing instant feedback and module execution."
  - question: "How does Playwright prevent flaky tests caused by asynchronous UI rendering?"
    options:
      - "Through built-in auto-waiting assertions that automatically wait for elements to be attached, visible, and interactive before acting"
      - "By inserting hardcoded 10-second sleep pauses on every line"
      - "By disabling CSS transitions"
      - "By running tests in single-thread mode"
    correct_index: 0
    explanation: "Playwright auto-waits for elements to reach actionable states (visible, enabled, stable) before executing clicks or assertions."
  - question: "What is the role of an 'integration test' compared to a 'unit test'?"
    options:
      - "Integration tests verify that multiple interconnected components (such as an API route querying a database) work correctly together"
      - "Integration tests test single mathematical functions in isolation"
      - "Integration tests only check CSS font styles"
      - "Integration tests are executed by customer support"
    correct_index: 0
    explanation: "Integration tests validate data flow and interactions between multiple modules or real infrastructure services."
  - question: "How can test idempotency be maintained when running integration tests against a database?"
    options:
      - "By executing each test within isolated database transactions that roll back or by creating disposable test database schemas"
      - "By running tests only on production databases"
      - "By disabling foreign key constraints permanently"
      - "By deleting the database after every test"
    correct_index: 0
    explanation: "Transactional rollbacks or unique test database fixtures guarantee test isolation without data cross-contamination."
  - question: "What does 'vi.spyOn(object, method)' do in Vitest?"
    options:
      - "Creates a mock spy that wraps an existing method, tracking its invocations, arguments, and return values"
      - "Deletes the method from the object"
      - "Logs user keystrokes"
      - "Encrypts the function code"
    correct_index: 0
    explanation: "vi.spyOn observes method calls, arguments, and outcomes while optionally preserving or mocking original behavior."
  - question: "Which Playwright locator strategy is recommended as the most resilient for finding interactive UI elements?"
    options:
      - "User-facing role and text locators (e.g., page.getByRole('button', { name: 'Submit' }))"
      - "Deep fragile CSS selectors (e.g., div > div:nth-child(3) > span)"
      - "XPath coordinates"
      - "Hardcoded pixel coordinates"
    correct_index: 0
    explanation: "Accessible user-facing locators (getByRole, getByLabel) mimic real user interaction and resist markup refactors."
  - question: "What is 'Code Coverage' in automated testing suites?"
    options:
      - "A metric measuring the percentage of application lines, branches, and functions executed during automated test runs"
      - "The total number of comments in source files"
      - "The speed of the network connection"
      - "The number of Git commits"
    correct_index: 0
    explanation: "Code coverage tracks which lines and branches were executed by tests, identifying untested code paths."
