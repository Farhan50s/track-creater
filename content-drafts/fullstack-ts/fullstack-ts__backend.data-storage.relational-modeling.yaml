one_sentence_definition: >-
  Relational data modeling designs normalized schema architectures, entity relationships, integrity constraints, and primary/foreign key hierarchies.

why_it_matters: >-
  Poorly modeled database schemas lead to data anomalies, orphan records, and costly redesigns. Proper normalization and cascading foreign key rules ensure referential consistency and eliminate redundancy across database lifecycles.

quick_overview: >-
  Relational database modeling structures structured enterprise data into tables comprising rows and columns with explicit constraints. Entity-relationship modeling establishes 1-to-1, 1-to-many, and many-to-many relationships using Primary Keys for row identity and Foreign Keys for relational integrity. Database normalization guidelines (First, Second, and Third Normal Form) eliminate update, insertion, and deletion anomalies by ensuring non-key attributes depend exclusively on primary keys. Defining referential integrity rules (CASCADE, SET NULL, RESTRICT) guarantees database engines maintain relational truth automatically.

deep_dive: >-
  Relational modeling forms the permanent foundation of application state persistence:

  1. Entity Relationships:
  - One-to-One (1:1): A user has one user profile. Foreign key placed on child table with a UNIQUE constraint.
  - One-to-Many (1:N): A track has multiple pillars. The `pillars` table contains `track_id` referencing `tracks.track_id`.
  - Many-to-Many (M:N): Users and roles. Requires an intermediate junction / join table (`user_roles`) with composite primary keys (`user_id`, `role_id`).

  2. Database Normalization Stages:
  - 1NF (Atomic Values): Every column contains atomic (indivisible) values, and each record is uniquely identified by a primary key.
  - 2NF (No Partial Dependencies): Table is in 1NF, and all non-key columns depend on the entire primary key (relevant for composite keys).
  - 3NF (No Transitive Dependencies): Table is in 2NF, and non-key columns depend solely on the primary key without intermediary dependencies (e.g., storing customer zip code without duplicating city/state if zip determines city).

  3. Referential Actions on Deletion/Update:
  Foreign key constraints define behavior when a parent row is deleted:
  - `ON DELETE CASCADE`: Automatically deletes child records (e.g., deleting a quiz question deletes its answers).
  - `ON DELETE RESTRICT`: Blocks parent deletion if child references exist.
  - `ON DELETE SET NULL`: Sets child foreign key to NULL if allowed.

  4. Database Constraints:
  - `PRIMARY KEY`: Unique, non-null row identifier.
  - `UNIQUE`: Prevents duplicate entries (e.g., user email).
  - `CHECK`: Enforces domain rules (e.g., `CHECK (score >= 0 AND score <= 100)`).
  - `NOT NULL`: Guarantees mandatory data presence.

