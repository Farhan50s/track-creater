quiz_pool:
  - question: "What does Third Normal Form (3NF) mandate in database schema design?"
    options:
      - "All non-key attributes must depend directly and solely on the primary key, eliminating transitive dependencies"
      - "Every table must have at least 3 foreign keys"
      - "All data must be stored in JSONB columns"
      - "No table may exceed 3 columns"
    correct_index: 0
    explanation: "3NF requires a table to be in 2NF and have no transitive functional dependencies among non-key attributes."
  - question: "How are Many-to-Many (M:N) relationships implemented in relational databases?"
    options:
      - "By creating a junction (join) table containing foreign keys referencing both primary tables"
      - "By storing comma-separated strings in a text column"
      - "By duplicating the parent table"
      - "By creating a single JSON array column"
    correct_index: 0
    explanation: "A junction table links two entities using foreign keys and composite primary keys to represent many-to-many associations."
  - question: "What is the behavior of the foreign key rule 'ON DELETE CASCADE'?"
    options:
      - "Deleting the parent row automatically deletes all corresponding child rows referencing it"
      - "It prevents the parent row from being deleted"
      - "It sets the child foreign key column to NULL"
      - "It disables the foreign key constraint"
    correct_index: 0
    explanation: "ON DELETE CASCADE cascades parent deletions down to all dependent child records automatically."
  - question: "What does First Normal Form (1NF) require?"
    options:
      - "Columns must hold atomic (indivisible) values, and rows must be uniquely identified by a primary key"
      - "All tables must have only 1 row"
      - "Foreign keys cannot be used"
      - "All columns must be integers"
    correct_index: 0
    explanation: "1NF eliminates repeating groups and ensures every column holds single atomic values."
  - question: "What is the purpose of a database 'CHECK' constraint?"
    options:
      - "To enforce domain-specific validation rules on column values at the database engine level (e.g. price > 0)"
      - "To verify user passwords"
      - "To check database disk space"
      - "To run unit tests"
    correct_index: 0
    explanation: "CHECK constraints validate that boolean expressions on column values evaluate to true before allowing inserts or updates."
  - question: "Why is storing comma-separated lists of IDs in a single text column considered an anti-pattern in relational databases?"
    options:
      - "It violates 1NF, prevents foreign key integrity checks, and makes querying/indexing individual items extremely inefficient"
      - "PostgreSQL rejects text columns"
      - "It encrypts the entire database"
      - "It prevents tables from having primary keys"
    correct_index: 0
    explanation: "Un-normalized multi-value columns destroy relational integrity, prevent indexing, and complicate joins."
  - question: "What does the 'ON DELETE RESTRICT' action do when attempting to delete a parent row?"
    options:
      - "It blocks the deletion and raises an error if any child rows reference that parent row"
      - "It deletes the database"
      - "It cascades the delete to the parent table"
      - "It deletes child rows silently"
    correct_index: 0
    explanation: "ON DELETE RESTRICT prevents parent record deletion as long as dependent child rows exist."
  - question: "What constraint ensures that no two rows have the same value in a specific column (such as email)?"
    options:
      - "UNIQUE"
      - "CHECK"
      - "FOREIGN KEY"
      - "DEFAULT"
    correct_index: 0
    explanation: "The UNIQUE constraint guarantees uniqueness of column values across all rows in the table."
