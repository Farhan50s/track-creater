one_sentence_definition: >-
  Node.js executes asynchronous event-driven JavaScript via libuv, while Express coordinates composable middleware pipelines for HTTP request processing.

why_it_matters: >-
  Understanding the single-threaded event loop prevents server thread starvation and performance degradation under high concurrent request volumes. Express middleware chains structure logging, security headers, and request processing pipelines.

quick_overview: >-
  Node.js executes server-side JavaScript through the Google V8 engine coupled with libuv for non-blocking asynchronous I/O. Through its multi-phase event loop (timers, pending callbacks, poll, check, close), Node.js services thousands of concurrent network connections without allocating a thread per connection. Express.js builds upon Node's core http module, providing a minimalist web framework centered around composable middleware functions. Middleware intercept incoming requests, execute application logic, mutate request contexts, and pass control along the pipeline via next() or terminate by sending an HTTP response.

deep_dive: >-
  The Node.js runtime leverages an event-driven concurrency model to achieve high throughput:

  1. The Event Loop Architecture:
  While JavaScript executes on a single main thread, asynchronous I/O operations (file system, DNS, crypto, network sockets) are offloaded to libuv's thread pool or the operating system kernel:
  - Timers: Executes callbacks scheduled by `setTimeout` and `setInterval`.
  - Pending Callbacks: Executes deferred I/O callbacks.
  - Poll: Retrieves new I/O events and executes their callbacks.
  - Check: Executes `setImmediate` callbacks.
  - Close Callbacks: Executes socket close handlers (`socket.on('close')`).
  Crucially, `process.nextTick` and Promise microtasks execute immediately after the current synchronous operation finishes, prior to advancing to the next event loop phase.

  2. Express Middleware Pipeline:
  Express structures server logic through ordered middleware functions:
  ```ts
  import express, { Request, Response, NextFunction } from 'express';
  import helmet from 'helmet';
  import cors from 'cors';

  const app = express();
  app.use(helmet());
  app.use(cors());
  app.use(express.json({ limit: '1mb' }));

  // Custom Authentication Middleware
  app.use((req: Request, res: Response, next: NextFunction) => {
    const authHeader = req.headers.authorization;
    if (!authHeader) return res.status(401).json({ error: 'Unauthorized' });
    next();
  });
  ```

  3. Global Error Handling Middleware:
  Express designates 4-parameter functions as global error handlers:
  ```ts
  app.use((err: Error, req: Request, res: Response, next: NextFunction) => {
    console.error('[Unhandled Error]:', err.stack);
    res.status(500).json({ error: 'Internal Server Error', message: err.message });
  });
  ```
  Placing error middleware at the very end of the pipeline ensures uncaught exceptions and rejected promises routed via `next(err)` are captured gracefully.

