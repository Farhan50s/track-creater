quiz_pool:
  - question: "What is the primary benefit of Multi-Stage Docker builds in TypeScript projects?"
    options:
      - "They isolate build tools (compilers, devDependencies) in earlier stages, producing small, secure production images containing only runtime assets"
      - "They compile TypeScript into Python"
      - "They eliminate the need for Docker Compose"
      - "They automatically deploy code to AWS"
    correct_index: 0
    explanation: "Multi-stage builds discard compilers and dev tools, resulting in lightweight, secure production images."
  - question: "Why should production containers switch from root to a non-root user (e.g. USER node)?"
    options:
      - "To mitigate privilege escalation attacks if an attacker compromises the container process"
      - "Because Node.js cannot execute as root"
      - "To increase CPU clock speeds"
      - "To compress the image size by 50%"
    correct_index: 0
    explanation: "Running as a non-root user prevents container breakout vulnerabilities from gaining root host privileges."
  - question: "What is the purpose of the '.dockerignore' file?"
    options:
      - "To prevent unnecessary files (node_modules, .env, .git) from being copied into the Docker build context"
      - "To ignore failed Docker builds"
      - "To disable network connections"
      - "To delete local files automatically"
    correct_index: 0
    explanation: ".dockerignore excludes sensitive or large files from being sent to the Docker daemon during build time."
  - question: "How does Docker Compose enable communication between different service containers (e.g. app connecting to db)?"
    options:
      - "It creates an isolated virtual bridge network where services can resolve each other using their service names as DNS hostnames"
      - "By sharing the same localhost IP address"
      - "Via bluetooth connections"
      - "Through public internet URLs"
    correct_index: 0
    explanation: "Docker Compose provisions a shared network where service names (e.g. 'db', 'cache') resolve automatically via internal DNS."
  - question: "Why are persistent Docker Volumes used for PostgreSQL database containers in Docker Compose?"
    options:
      - "To persist database data on host disk storage so data is not lost when the database container stops or restarts"
      - "To make SQL queries execute faster"
      - "To encrypt database tables"
      - "To convert PostgreSQL into SQLite"
    correct_index: 0
    explanation: "Container file systems are ephemeral; named volumes preserve database files across container lifecycle recreations."
  - question: "Why is 'COPY package*.json ./' and 'RUN npm ci' executed before copying application source code in Dockerfiles?"
    options:
      - "To leverage Docker layer caching, preventing slow dependency re-installation when only source files change"
      - "Because npm ci deletes source files"
      - "Because Docker cannot read TypeScript"
      - "To reduce RAM usage during startup"
    correct_index: 0
    explanation: "Docker caches intermediate layers; copying lockfiles first allows Docker to reuse cached node_modules if dependencies haven't changed."
  - question: "What does the EXPOSE instruction do in a Dockerfile?"
    options:
      - "Documents the network port on which the container application listens at runtime"
      - "Automatically publishes the port to the public internet"
      - "Disables the firewall"
      - "Encrypts network traffic"
    correct_index: 0
    explanation: "EXPOSE acts as metadata documentation specifying the container's intended listening ports."
  - question: "Which command starts all services defined in a docker-compose.yml file in detached background mode?"
    options:
      - "docker compose up -d"
      - "docker compose run"
      - "docker start all"
      - "docker compose build --fast"
    correct_index: 0
    explanation: "docker compose up -d builds, creates, and starts all defined service containers in background detached mode."
