one_sentence_definition: >-
  Docker packages full-stack applications into isolated container images using multi-stage builds and multi-container Docker Compose orchestration.

why_it_matters: >-
  "It works on my machine" bugs occur when local environments diverge from production operating systems. Docker guarantees reproducible execution environments, while multi-stage builds strip developer toolchains to produce tiny, secure production runtime images.

quick_overview: >-
  Docker is the industry-standard containerization platform for isolating application runtimes, dependencies, system libraries, and network ports. Multi-stage Dockerfiles optimize build pipelines by separating the compile stage (containing TypeScript compilers, devDependencies, and test runners) from the minimal production runner stage (containing only Node.js runtime, production node_modules, and compiled JavaScript). Docker Compose orchestrates multi-container local development environments, spinning up Node.js servers, PostgreSQL databases, and Redis caches with isolated virtual networks and persistent volume mounts.

deep_dive: >-
  Mastering containerization patterns for full-stack TypeScript services:

  1. Multi-Stage Dockerfile Optimization:
  Multi-stage builds prevent shipping source compilers, package managers, and devDependencies into production containers:
  ```dockerfile
  # Stage 1: Base Dependencies
  FROM node:20-alpine AS deps
  WORKDIR /app
  COPY package*.json ./
  RUN npm ci

  # Stage 2: Builder
  FROM node:20-alpine AS builder
  WORKDIR /app
  COPY --from=deps /app/node_modules ./node_modules
  COPY . .
  RUN npm run build
  RUN npm prune --production

  # Stage 3: Production Runner
  FROM node:20-alpine AS runner
  WORKDIR /app
  ENV NODE_ENV=production
  USER node
  COPY --from=builder /app/dist ./dist
  COPY --from=builder /app/node_modules ./node_modules
  COPY package.json ./

  EXPOSE 3000
  CMD ["node", "dist/index.js"]
  ```

  2. Security & Image Hardening:
  - Non-Root User: Running as `USER node` prevents root-privilege escalation if container execution is compromised.
  - Alpine/Distroless Base: Using slim base images minimizes CVE attack surfaces.
  - `.dockerignore`: Excludes `node_modules`, `.git`, `.env`, and local build artifacts from container build context.

  3. Docker Compose Local Orchestration:
  A declarative `docker-compose.yml` orchestrates services:
  ```yaml
  version: '3.8'
  services:
    app:
      build: .
      ports:
        - "3000:3000"
      environment:
        - DATABASE_URL=postgres://user:pass@db:5432/appdb
        - REDIS_URL=redis://cache:6379
      depends_on:
        - db
        - cache

    db:
      image: postgres:16-alpine
      environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: pass
        POSTGRES_DB: appdb
      volumes:
        - postgres_data:/var/lib/postgresql/data

    cache:
      image: redis:7-alpine

  volumes:
    postgres_data:
  ```

