quiz_pool:
  - question: "What is the primary advantage of type-safe ORMs over raw SQL strings in TypeScript?"
    options:
      - "Compile-time type checking and autocompletion matching exact database schemas, eliminating runtime typos"
      - "They convert PostgreSQL to MongoDB"
      - "They eliminate database storage requirements"
      - "They make queries run in the browser"
    correct_index: 0
    explanation: "Type-safe ORMs validate query parameters and return types during TypeScript compilation."
  - question: "How does Drizzle ORM differ from Prisma in its architectural design?"
    options:
      - "Drizzle defines schemas directly in pure TypeScript with zero code-generation steps and functions as a thin SQL-like query builder"
      - "Drizzle only works with SQLite"
      - "Drizzle cannot connect to PostgreSQL"
      - "Drizzle does not support transactions"
    correct_index: 0
    explanation: "Drizzle relies on native TypeScript type inference from schema definitions, offering minimal runtime overhead."
  - question: "What command in Prisma updates the TypeScript client types after editing schema.prisma?"
    options:
      - "npx prisma generate"
      - "npx prisma seed"
      - "npx prisma format"
      - "npx prisma drop"
    correct_index: 0
    explanation: "prisma generate parses schema.prisma and emits the updated TypeScript client."
  - question: "Why is a migration tracking table (such as _prisma_migrations) necessary in production databases?"
    options:
      - "To track which schema migration scripts have been executed, preventing duplicate or out-of-order schema applications"
      - "To store user authentication tokens"
      - "To compress database backups"
      - "To log web server errors"
    correct_index: 0
    explanation: "Migration tracking tables record executed migration files and their checksums to ensure consistent database schema evolution."
  - question: "What is the 'N+1 query problem' in database ORMs?"
    options:
      - "Executing one initial query to fetch N parent records, followed by N separate queries to fetch related child records"
      - "Running N+1 transactions simultaneously"
      - "Adding N+1 columns to an index"
      - "Queries taking longer than N+1 seconds"
    correct_index: 0
    explanation: "The N+1 problem occurs when an application fires separate queries for each entity relation instead of joining in batch."
  - question: "How do type-safe ORMs handle relational joins in TypeScript return types?"
    options:
      - "By dynamically typing nested relation properties when an 'include' or 'with' clause is specified in the query"
      - "By returning all relations as raw JSON strings"
      - "By deleting parent properties"
      - "By returning undefined for all child rows"
    correct_index: 0
    explanation: "ORMs adjust TypeScript return types based on query select/include options, populating relation arrays with proper types."
  - question: "What is connection pooling and why is it essential when using ORMs in serverless environments?"
    options:
      - "Reusing a managed pool of persistent database connections to prevent exhausting PostgreSQL connection limits during concurrent scaling"
      - "Encrypting database connections with SSL"
      - "Merging multiple tables into one"
      - "Caching static HTML files"
    correct_index: 0
    explanation: "Connection poolers (e.g., PgBouncer) manage reusable connections, preventing serverless spikes from overloading PostgreSQL."
  - question: "What is the risk of adding a NOT NULL column without a default value to an existing large production table?"
    options:
      - "PostgreSQL will fail the migration if existing rows exist and acquire an exclusive table lock that blocks traffic"
      - "The database drops all foreign keys"
      - "PostgreSQL converts all data to strings"
      - "The server crashes permanently"
    correct_index: 0
    explanation: "Adding NOT NULL to existing populated tables requires either a DEFAULT value or a multi-step backfill migration."
