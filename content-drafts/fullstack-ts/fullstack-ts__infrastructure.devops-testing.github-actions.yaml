one_sentence_definition: >-
  GitHub Actions configures declarative CI/CD pipelines to automate linting, type-checking, automated testing, container builds, and production deployments.

why_it_matters: >-
  Manual deployments and unverified merges cause broken production builds and deployment outages. GitHub Actions enforces strict branch protection gates and automates zero-downtime production rollouts on every pull request.

quick_overview: >-
  Continuous Integration and Continuous Deployment (CI/CD) automates software verification and delivery lifecycles. GitHub Actions is a declarative, event-driven automation platform built directly into GitHub. YAML workflow files (located in .github/workflows/) define jobs triggered on repository events (push, pull_request, release). Automated pipeline stages include dependency caching, static type analysis (tsc --noEmit), code linting (ESLint), unit and integration testing, Docker container image builds, security vulnerability scanning, and deployment to hosting environments (Vercel, AWS ECS, Fly.io).

deep_dive: >-
  Authoring robust CI/CD automation pipelines with GitHub Actions:

  1. Declarative Workflow Architecture:
  A production CI workflow `.github/workflows/ci.yml`:
  ```yaml
  name: CI Pipeline

  on:
    pull_request:
      branches: [main]
    push:
      branches: [main]

  jobs:
    validate:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: 'npm'

        - name: Install Dependencies
          run: npm ci

        - name: Static Type Check
          run: npx tsc --noEmit

        - name: Lint Code
          run: npm run lint

        - name: Execute Vitest Tests
          run: npm run test:unit

        - name: Build Application
          run: npm run build
  ```

  2. Continuous Deployment & Secret Management:
  Secrets (API keys, Supabase service keys, AWS tokens) are stored in repository encrypted secrets (`${{ secrets.PROD_API_KEY }}`) and injected into runner environments at execution time without appearing in commit histories.

  3. Branch Protection Rules:
  Production `main` branches enforce branch protection:
  - Require status checks to pass before merging (`validate` job).
  - Require pull request code reviews.
  - Enforce linear git history and signed commits.

  4. Deployment Strategies & Rollbacks:
  Deployments tag Docker images with the commit SHA (`app:${{ github.sha }}`), enabling atomic blue-green traffic switching and instant rollback to previous healthy image tags if health checks fail.

