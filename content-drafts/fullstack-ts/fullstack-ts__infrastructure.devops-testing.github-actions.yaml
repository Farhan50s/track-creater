quiz_pool:
  - question: "Why is 'npm ci' preferred over 'npm install' in automated CI/CD pipeline workflows?"
    options:
      - "npm ci strictly installs exact versions from package-lock.json without mutating the lockfile, ensuring deterministic builds"
      - "npm ci downloads packages without internet access"
      - "npm ci compiles JavaScript into C++"
      - "npm ci only works on CSS files"
    correct_index: 0
    explanation: "npm ci guarantees deterministic, clean installations based on package-lock.json and fails if lockfile mismatches occur."
  - question: "What is a 'Branch Protection Rule' in repository management?"
    options:
      - "A policy enforcing that all automated CI checks and code reviews must pass before pull requests can merge into protected branches"
      - "A script that deletes stale Git branches"
      - "An antivirus scan for Git commits"
      - "A command that renames branches"
    correct_index: 0
    explanation: "Branch protection rules block direct unverified commits, ensuring all PRs pass automated tests before merging to main."
  - question: "Where should sensitive production database credentials and API secret keys be configured for GitHub Actions workflows?"
    options:
      - "In GitHub Repository Encrypted Secrets, referenced via ${{ secrets.KEY_NAME }}"
      - "Hardcoded directly in workflow YAML files"
      - "Committed into public .env files"
      - "Posted in pull request descriptions"
    correct_index: 0
    explanation: "Encrypted secrets store sensitive tokens securely and prevent accidental exposure in source control or job logs."
  - question: "What does the 'actions/checkout@v4' action do in a workflow job?"
    options:
      - "Clones the repository code onto the virtual runner machine so subsequent steps can access project files"
      - "Deploys code to production"
      - "Purchases a domain name"
      - "Runs unit tests"
    correct_index: 0
    explanation: "actions/checkout downloads the repository code to the runner workspace."
  - question: "What is the difference between Continuous Integration (CI) and Continuous Deployment (CD)?"
    options:
      - "CI automates code building and testing on every commit, while CD automates deploying validated builds to target environments"
      - "CI is for frontend and CD is for backend"
      - "CI is written in Python and CD in TypeScript"
      - "There is no difference"
    correct_index: 0
    explanation: "CI validates code quality through automated tests; CD delivers validated artifacts directly to production."
  - question: "Why should container images built in CI/CD pipelines be tagged with git commit SHAs (e.g., app:commit_sha) rather than just 'latest'?"
    options:
      - "To provide immutable traceability between running deployments and source code, enabling instant rollbacks to known commits"
      - "Because Docker disallows the latest tag"
      - "To make image files 90% smaller"
      - "To encrypt the container disk"
    correct_index: 0
    explanation: "Commit SHA tagging ensures reproducible, immutable artifact versioning and reliable rollback capabilities."
  - question: "How can dependency caching optimize GitHub Actions workflow run durations?"
    options:
      - "By caching ~/.npm or node_modules across workflow runs, skipping redundant package downloads when package-lock.json is unchanged"
      - "By skipping test execution"
      - "By deleting old commits"
      - "By compressing source files"
    correct_index: 0
    explanation: "Dependency caching preserves package manager caches between runs, slashing build execution times."
  - question: "What triggers a GitHub Actions workflow defined with 'on: [pull_request]'?"
    options:
      - "Opening, synchronizing (pushing new commits), or reopening a pull request"
      - "A user viewing the website in a browser"
      - "A database query error"
      - "A scheduled cron timer once per year"
    correct_index: 0
    explanation: "The pull_request event triggers workflow runs when PRs are opened or updated with new commits."
