quiz_pool:
  - question: "Which HTTP status code should be returned when a POST request successfully creates a new database resource?"
    options:
      - "201 Created"
      - "200 OK"
      - "204 No Content"
      - "302 Found"
    correct_index: 0
    explanation: "201 Created indicates the request succeeded and resulted in the creation of a new resource."
  - question: "How does Zod infer a static TypeScript type from a runtime schema definition?"
    options:
      - "Using 'z.infer<typeof Schema>'"
      - "Using 'typeof Schema'"
      - "Using 'Schema.toType()'"
      - "Using 'interface from Schema'"
    correct_index: 0
    explanation: "z.infer<typeof Schema> extracts the static TypeScript type representation directly from the Zod schema."
  - question: "What is the difference between 'PUT' and 'PATCH' HTTP methods in RESTful API design?"
    options:
      - "PUT completely replaces the entire resource representation, while PATCH applies partial updates to specific fields"
      - "PUT is for creating and PATCH is for deleting"
      - "PATCH cannot be used over HTTPS"
      - "PUT only accepts XML payloads"
    correct_index: 0
    explanation: "PUT is idempotent and replaces the complete resource; PATCH modifies only the specified attributes."
  - question: "What is the primary benefit of using 'schema.safeParse()' instead of 'schema.parse()' in Zod?"
    options:
      - "safeParse returns a result object with a success boolean without throwing uncaught runtime exceptions"
      - "safeParse runs 10x faster"
      - "safeParse converts errors to null"
      - "safeParse bypasses all validations"
    correct_index: 0
    explanation: "safeParse returns a discriminated union result, making error handling clean and preventing unhandled exceptions."
  - question: "Which HTTP status code signifies that request validation failed due to invalid schema fields?"
    options:
      - "422 Unprocessable Entity or 400 Bad Request"
      - "500 Internal Server Error"
      - "403 Forbidden"
      - "404 Not Found"
    correct_index: 0
    explanation: "422 Unprocessable Entity (or 400 Bad Request) indicates syntactically correct requests that fail semantic domain validation rules."
  - question: "What does 'z.string().email().optional()' validate?"
    options:
      - "A valid email string format, or undefined"
      - "Only empty strings"
      - "Any string regardless of format"
      - "Numbers and booleans"
    correct_index: 0
    explanation: "It requires the value, if present, to be a valid RFC email address string, while allowing undefined."
  - question: "What does 'safeParse' do with unexpected, undeclared fields in an object payload by default in Zod?"
    options:
      - "It strips out unknown keys, returning only the validated schema fields in result.data"
      - "It copies them to localStorage"
      - "It raises a database alert"
      - "It shuts down Express"
    correct_index: 0
    explanation: "Zod strips unknown keys by default, protecting backends from mass assignment vulnerabilities."
  - question: "Which HTTP method is considered 'safe' and 'idempotent' for reading resources without modifying server state?"
    options:
      - "GET"
      - "POST"
      - "DELETE"
      - "PATCH"
    correct_index: 0
    explanation: "GET requests are read-only, safe, and idempotent, meaning repeated invocations produce the same effect without modifying state."
