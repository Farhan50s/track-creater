one_sentence_definition: >-
  RESTful API design structures predictable HTTP endpoints with standardized status codes, while Zod enforces runtime schema validation and static type inference.

why_it_matters: >-
  Untyped and unvalidated client payloads invite injection attacks and corrupted database states. Combining REST principles with Zod runtime validation guarantees incoming requests conform strictly to domain contracts before business logic executes.

quick_overview: >-
  RESTful web APIs provide resource-oriented architectures using standard HTTP methods (GET for safe reads, POST for creation, PUT for complete replacement, PATCH for partial updates, DELETE for removal) and standardized HTTP status codes (200 OK, 201 Created, 204 No Content, 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 422 Unprocessable Entity). Zod is a TypeScript-first schema declaration and validation library. By validating incoming HTTP request bodies, URL params, and query strings with Zod schemas, backend engineers eliminate runtime type errors and automatically infer static TypeScript types via z.infer<typeof Schema>.

deep_dive: >-
  Building production-grade REST APIs requires combining standardized HTTP resource modeling with strict input boundary validation:

  1. RESTful URL & Method Standards:
  Endpoints represent plural noun resources with nested relationship hierarchies:
  - `GET /api/v1/tracks` - List all tracks
  - `POST /api/v1/tracks` - Create a new track
  - `GET /api/v1/tracks/:trackId/pillars` - List pillars for a specific track
  - `PATCH /api/v1/tracks/:trackId` - Partially update a track

  2. Zod Schema Declaration & Type Inference:
  Zod schemas define runtime contracts and emit TypeScript types simultaneously:
  ```ts
  import { z } from 'zod';

  export const CreateUserSchema = z.object({
    email: z.string().email('Invalid email address'),
    password: z.string().min(8, 'Password must be at least 8 characters'),
    role: z.enum(['admin', 'member', 'viewer']).default('member'),
    age: z.number().int().positive().optional(),
  });

  export type CreateUserInput = z.infer<typeof CreateUserSchema>;
  ```

  3. Express Validation Middleware:
  Validating request payloads before route handlers execute:
  ```ts
  export function validateBody<T extends z.ZodSchema>(schema: T) {
    return (req: Request, res: Response, next: NextFunction) => {
      const result = schema.safeParse(req.body);
      if (!result.success) {
        return res.status(422).json({
          error: 'Validation Failed',
          details: result.error.flatten().fieldErrors,
        });
      }
      req.body = result.data; // Strips unknown fields
      next();
    };
  }
  ```

  4. Safe Parsing vs Throwing:
  Using `schema.safeParse(input)` returns a discriminated union (`{ success: true, data }` or `{ success: false, error }`), avoiding unhandled exception crashes.

