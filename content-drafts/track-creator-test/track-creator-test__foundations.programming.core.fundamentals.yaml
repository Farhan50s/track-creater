quiz_pool:
  - question: What is the primary purpose of a variable in computer programming?
    options:
      - To store data values in named memory locations
      - To compile source code directly into machine binaries
      - To manage network socket connections
      - To render graphical user interfaces
    correct_index: 0
  - question: Which data type is specifically designed to represent truth values (true or false)?
    options:
      - Integer
      - Boolean
      - String
      - Floating-point
    correct_index: 1
  - question: What happens during explicit type casting in typed languages?
    options:
      - The compiler silently infers the target type without instruction
      - The runtime halts execution permanently
      - The programmer explicitly converts a value from one data type to another
      - Variable memory addresses are swapped automatically
    correct_index: 2
  - question: In programming, what does the scope of a variable determine?
    options:
      - The maximum numeric limit of the variable
      - The execution speed of arithmetic operations
      - The region of code where the variable is accessible and valid
      - The disk storage space occupied by the script
    correct_index: 2
  - question: Which of the following is an immutable primitive in most modern programming languages?
    options:
      - Fixed-size string literals
      - Dynamic heap-allocated hash maps
      - Linked list node instances
      - Circular buffer containers
    correct_index: 0
  - question: What does operator precedence govern in arithmetic expressions?
    options:
      - The order in which operators are evaluated in complex expressions
      - The amount of memory allocated for variables
      - The network transmission priority of data
      - The visual indentation of code blocks
    correct_index: 0
  - question: What is the result of an arithmetic division by zero in standard integer arithmetic?
    options:
      - It automatically wraps around to zero
      - It raises a runtime error or exception
      - It converts the result into an empty string
      - It restarts the computer system
    correct_index: 1
  - question: What is the defining characteristic of strongly typed languages?
    options:
      - Code must always be compiled directly to C
      - Variable types are enforced strictly and unintended type conversions are rejected
      - All variables are stored in global scope
      - Syntax errors are ignored during compilation
    correct_index: 1
  - question: Which component evaluates conditions to produce boolean outcomes in programs?
    options:
      - Relational and logical comparison operators
      - Asset bundlers
      - CSS style preprocessors
      - Audio codec decoders
    correct_index: 0

