quiz_pool:
  - question: What two properties are required for a problem to be solvable via Dynamic Programming?
    options:
      - Optimal substructure and overlapping subproblems
      - Linear time execution and zero memory footprint
      - Global variable mutation and tail recursion
      - Unsorted inputs and binary leaf nodes
    correct_index: 0
  - question: What is the primary difference between memoization and tabulation in dynamic programming?
    options:
      - Memoization is top-down caching; tabulation is bottom-up iterative computation
      - Memoization only works on GPU threads; tabulation is CPU only
      - Tabulation requires infinite recursion; memoization avoids variables
      - They are mutually exclusive mathematical paradoxes
    correct_index: 0
  - question: Which algorithm finds the shortest path between nodes in a weighted graph with non-negative edge weights?
    options:
      - Dijkstra's algorithm
      - Linear Regression
      - Quick Sort
      - Depth-First Search with post-order traversal
    correct_index: 0
  - question: What graph representation is strictly required to perform a Topological Sort?
    options:
      - Directed Acyclic Graph (DAG)
      - Undirected cyclic grid
      - Complete bipartite tree with self-loops
      - Unconnected leaf forest
    correct_index: 0
  - question: What is the average time complexity of finding an element in a balanced Binary Search Tree?
    options:
      - O(log n)
      - O(n^2)
      - O(n!)
      - O(1)
    correct_index: 0
  - question: What data structure is typically used to implement Breadth-First Search (BFS)?
    options:
      - Queue (FIFO)
      - Stack (LIFO)
      - Red-Black Tree
      - Minimum Spanning Tree
    correct_index: 0
  - question: What technique does Dijkstra's algorithm use to efficiently retrieve the next unvisited vertex with the smallest distance?
    options:
      - Min-Priority Queue (Binary Heap)
      - Simple circular buffer
      - Random number generator
      - Linear file scan on disk
    correct_index: 0
  - question: In Big-O notation, what does O(n log n) complexity represent compared to O(n^2)?
    options:
      - Significantly faster scaling for large values of n
      - Slower execution across all inputs
      - Exponential runaway resource consumption
      - Fixed constant-time execution
    correct_index: 0
  - question: What is a cycle in graph theory?
    options:
      - A non-empty path in which the first and last vertices are identical
      - A graph with zero edges
      - A tree with only one child per node
      - A completely disconnected vertex
    correct_index: 0

