quiz_pool:
  - question: What is the primary benefit of encapsulating logic within functions?
    options:
      - It reduces duplication and promotes code reusability
      - It eliminates the need for unit testing
      - It converts interpreted code into pure hardware circuitry
      - It increases disk usage proportionally
    correct_index: 0
  - question: In a function definition, what is the term for the variables declared to receive inputs?
    options:
      - Return statements
      - Parameters
      - Macros
      - Callbacks
    correct_index: 1
  - question: What control flow structure executes a block repeatedly while a boolean condition remains true?
    options:
      - While loop
      - Try/catch block
      - If/else branch
      - Module export
    correct_index: 0
  - question: What occurs when a recursive function lacks a valid base case?
    options:
      - The program compiles faster
      - A stack overflow error occurs due to unbounded call stack growth
      - The function returns null immediately
      - System memory is permanently erased
    correct_index: 1
  - question: What is the purpose of a return statement inside a function?
    options:
      - To terminate function execution and optionally pass a result back to the caller
      - To restart the host operating system
      - To delete the calling script from disk
      - To declare a new global variable
    correct_index: 0
  - question: Which keyword is commonly used to prematurely exit a loop construct?
    options:
      - Continue
      - Break
      - Yield
      - Catch
    correct_index: 1
  - question: How does an if-else branching structure evaluate multiple conditions?
    options:
      - It executes all branches simultaneously regardless of predicates
      - It evaluates boolean conditions sequentially until a truthy condition is encountered
      - It randomly selects one branch to execute
      - It delays execution until user input is received
    correct_index: 1
  - question: What distinguishes arguments from parameters in function terminology?
    options:
      - Arguments are the actual values passed during a call; parameters are the placeholders in the definition
      - Parameters are passed at runtime; arguments are compile-time constants only
      - There is no difference; they are exact synonyms with identical meaning
      - Arguments only exist in functional languages
    correct_index: 0
  - question: What is pure function behavior in computer science?
    options:
      - A function that produces identical output for identical inputs and causes no observable side effects
      - A function that modifies global system state on every invocation
      - A function with zero return values
      - A function that executes only on GPU hardware
    correct_index: 0

