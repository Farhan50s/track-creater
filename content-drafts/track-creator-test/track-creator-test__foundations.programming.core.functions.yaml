one_sentence_definition: Reusable code blocks and branching mechanisms that structure program logic and direct execution pathways.
why_it_matters: Functions and control flow allow developers to encapsulate logic into modular units and make conditional execution decisions dynamically.
quick_overview: Functions package discrete computational tasks into callable units with input parameters and return values. Combined with conditional statements (if/else, switch) and iteration loops (for, while), control flow constructs guide the path of program execution based on runtime conditions.
deep_dive: |
  Functions encapsulate reusable routines, reducing duplication and improving testability. When a function is called, arguments are passed into parameters via pass-by-value or pass-by-reference semantics, and a stack frame is allocated on the call stack.

  Control flow statements alter the linear execution order of code:
  1. Conditional branches (if, else if, switch) evaluate predicates to select alternate execution paths.
  2. Loops (while, do-while, for) repeat a block of code until a terminating condition is met.

  Managing stack depth, early return patterns, and avoiding unbounded recursion are essential practices for building reliable software.

