quiz_pool:
  - question: What is the primary purpose of a CPU flame graph?
    options:
      - To visualize sampled call stacks and identify performance bottlenecks
      - To measure battery thermal output
      - To calculate database storage quotas
      - To render 3D animation graphics
    correct_index: 0
  - question: What risk is associated with premature optimization without empirical profiling?
    options:
      - Wasting engineering effort optimizing non-critical code paths while introducing complexity
      - Instant server shutdown
      - Immediate hardware disk fragmentation
      - Accidental compilation into assembly language
    correct_index: 0
  - question: What metric does memory profiling primarily inspect?
    options:
      - Heap allocations, object retention, and garbage collection frequency
      - Monitor refresh rates
      - Network ping latency to DNS root servers
      - Keyboard keystroke velocity
    correct_index: 0
  - question: In profiling terminology, what is a "hot path"?
    options:
      - A sequence of instructions executed with high frequency that consumes significant CPU time
      - A physical cable with high thermal dissipation
      - An encrypted network tunnel
      - A deprecated library route
    correct_index: 0
  - question: What is the main objective of micro-benchmarking?
    options:
      - To measure the isolated execution latency of specific code snippets under controlled conditions
      - To test complete end-to-end user journeys
      - To monitor multi-datacenter network routing
      - To generate synthetic audio files
    correct_index: 0
  - question: How does sampling profiling minimize overhead compared to instrumentation profiling?
    options:
      - It inspects the execution state periodically at fixed intervals rather than injecting hooks into every function call
      - It deletes unused functions before execution
      - It ignores all errors during testing
      - It runs only on test computers
    correct_index: 0
  - question: What does high garbage collection pause time indicate in managed runtimes?
    options:
      - Frequent creation and disposal of short-lived heap objects causing memory thrashing
      - A corrupted hard drive controller
      - Too few CPU cores installed
      - Perfect memory utilization
    correct_index: 0
  - question: What is a memory leak in long-running services?
    options:
      - Memory that is allocated but no longer needed and never freed due to lingering references
      - Immediate physical hardware damage
      - Loss of data during power outages
      - Memory wiped by antivirus scanners
    correct_index: 0
  - question: Why should micro-benchmarks account for compiler optimizations such as dead code elimination?
    options:
      - Because compilers may discard benchmarked code if its return value is never used, creating misleading results
      - Because compilers refuse to run benchmarks without root permissions
      - Because dead code elimination increases execution time by 100x
      - Because benchmarks cannot compile in release mode
    correct_index: 0

